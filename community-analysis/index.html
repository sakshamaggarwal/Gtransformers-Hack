essage regarding vitamin D is unsettled.", "source": "wapo_units", "comment_id": "20f020c8-f1a0-4481-bebf-9063d272e2e0", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 33, "who": "Reader 30", "quote": "So, is it the supplement causing the problem or the omega 3 and vitamin D from any source?", "source": "wapo_units", "comment_id": "62e631e5-e583-4274-9c9c-22c78e230e3e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 34, "who": "Reader 31", "quote": "Maybe it's the the gel used to make these capsules that is interfering.", "source": "wapo_units", "comment_id": "da6b5005-2c87-44d7-8a4c-fbcc741cb323", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 35, "who": "Reader 32", "quote": "Are there any supplements that can make me stronger without making me dumber?", "source": "wapo_units", "comment_id": "bb2858fc-482f-4e75-94a8-b1544a123836", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 36, "who": "Reader 33", "quote": "Olive oil -- can someone follow up on this?", "source": "wapo_units", "comment_id": "a6b1a757-59cf-44e6-a580-9b9c8ede7dcf", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 37, "who": "Reader 34", "quote": "I would suggest large database studies >100,000 subjects before even considering any associations", "source": "wapo_units", "comment_id": "1c515e00-cc85-490d-a54b-f557edd6d0c3", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 38, "who": "Reader 35", "quote": "you need to be cautious in putting people off using fish oil", "source": "wapo_units", "comment_id": "117ba694-e775-4f56-add0-cda8c13a3d95", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 39, "who": "Reader 36", "quote": "IMO, supplements are useful for specific, targeted reasons.", "source": "nyt_units", "comment_id": "154052144", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it9hg?rsrc=cshare"}]}, {"id": "T4", "title": "Glucosamine: long-time users' relief, doubts about the dementia link", "health": true, "breadth": 31, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Many readers describe long-term personal benefit from glucosamine for joint pain, while others question the study's design, confounding, and whether the supplement works at all.", "readers": 6, "refs": [1, 2, 3, 4, 5, 6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "Readers report taking glucosamine, often with chondroitin, for years or decades for arthritic or achy joints, and say it has helped with pain and mobility.", "readers": 8, "refs": [1, 2, 7, 8, 3, 9, 10, 11], "risk": "none", "risk_note": "Framed as personal experience, from several readers.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says that stopping glucosamine-chondroitin for two weeks brought back achy knees, and they won't stop.", "readers": 1, "refs": [2], "risk": "none", "risk_note": "Personal experience, no advice.", "verdict": "supported", "revised": false}, {"text": "One reader says glucosamine taken on an orthopedist's advice for knee arthritis upset their stomach and did not help.", "readers": 1, "refs": [12], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader recalls an orthopedic surgeon calling glucosamine his 'favorite supplement' because it gave people a false sense of security, and says he had done many knee replacements on long-time users.", "readers": 1, "refs": [13], "risk": "none", "risk_note": "Secondhand anecdote, lightly told.", "verdict": "supported", "revised": false}, {"text": "One reader says the person in question took glucosamine for inflammation and soreness from back issues, as suggested by a doctor he respects.", "readers": 1, "refs": [14], "risk": "none", "risk_note": "The comment does not say the person is the reader's husband, and does not say 'supplements' in the plural.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says a veterinarian told them to give their dogs fish oil and glucosamine.", "readers": 1, "refs": [15], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that glucosamine users may differ from non-users, for example by having serious knee osteoarthritis and reduced physical activity, which is linked to higher dementia risk.", "readers": 2, "refs": [4, 16], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers note that the finding is observational, so other explanations are possible, such as underlying inflammation driving both glucosamine use and higher mortality.", "readers": 3, "refs": [5, 6, 17], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader notes that the study reports on glucosamine generally, not N-acetyl glucosamine specifically.", "readers": 1, "refs": [18], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says a double-blind, placebo-controlled study in dogs with osteoarthritis found glucosamine or chondroitin ineffective.", "readers": 1, "refs": [19], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says three weeks is too short a time for glucosamine to change joint architecture.", "readers": 1, "refs": [20], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says the linked study was written by over 40 well qualified scientists at the University of Florida.", "readers": 1, "refs": [21], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "A reader says Dr. Sun's study of glucosamine effects was not small.", "readers": 1, "refs": [22], "risk": "none", "risk_note": "The figures in the item come from quoted study or article text, not from the reader's own words.", "verdict": "partly_supported", "revised": true}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether glucosamine actually works", "sides": [{"text": "It helps with joint pain and mobility, based on long personal use.", "readers": 6, "refs": [1, 2, 7, 3, 8, 9], "risk": "none", "risk_note": "Personal experiences from several readers.", "verdict": "supported", "revised": false}, {"text": "Evidence for benefit is weak or lacking: one reader is not convinced the supplements work, a dog trial found it ineffective, and one user saw no help.", "readers": 3, "refs": [6, 19, 12], "risk": "none", "risk_note": "c5 is a joking anecdote about a surgeon, not evidence about benefit.", "verdict": "partly_supported", "revised": true}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "Could people taking glucosamine for joint pain be more likely to see a doctor when mild cognitive impairment appears, confounding the association?", "readers": 1, "refs": [23], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Was glucosamine use associated with a higher likelihood of progressing from no cognitive impairment to mild cognitive impairment?", "readers": 1, "refs": [24], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Why wouldn't people try glucosamine if it works for dogs?", "readers": 1, "refs": [25], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says glucosamine seems to help some people and not others in the real world, and that studies are not the real world.", "readers": 1, "refs": [26], "risk": "none", "risk_note": "The comment is a statement, not a 'why' question.", "verdict": "partly_supported", "revised": true}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "the glucosamine-chondroitin tablets I've been taking the better part of 40 years hasn't been a major factor", "source": "nyt_units", "comment_id": "154106648", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iuuoo?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "I stopped taking glucosamine-chrondroitin tablets for 2 weeks when I ran out just to see if there was an impact.  There was…starting with achy knees.", "source": "nyt_units", "comment_id": "154195776", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j1lq0?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "Glucosamine has changed my life. Before, I could walk about a block, no more. Now I walk a mile and a half!", "source": "wapo_units", "comment_id": "e108e58d-893f-4c33-b485-eb430a7bc0bc", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "if you have serious knee osteoarthritis, you've probably tried glucosamine.", "source": "wapo_units", "comment_id": "ff0ef2fd-1348-4033-a4a8-4a39c2c390eb", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 5, "who": "Reader 5", "quote": "But since this is an observational study: There can be other explanations.", "source": "wapo_units", "comment_id": "a3514eca-2f3f-4b22-a888-9662d1e89def", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "any observational tests don't show much at all", "source": "wapo_units", "comment_id": "6dd7be25-3b96-4d6f-bbd0-e117632d3e0d", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 7, "who": "Reader 7", "quote": "Glucosamine and Chondroitin for joint mobility", "source": "nyt_units", "comment_id": "154056958", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ite7u?rsrc=cshare"}, {"n": 8, "who": "Reader 8", "quote": "The supplement has helped to mitigate my joint pain.", "source": "wapo_units", "comment_id": "92babe0b-44e5-43ed-94e2-87f5554c4c56", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 9, "who": "Reader 9", "quote": "glucosamine has made it possible to function without pain for that many years", "source": "wapo_units", "comment_id": "8c15b49a-8182-47c0-b5d5-68a6b2117b2a", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 10, "who": "Reader 10", "quote": "Before starting glucosamine, the osteoarthritis in both shoulders made raining either arm above shoulder level difficult and painful.", "source": "wapo_units", "comment_id": "d48ab70c-787e-4f68-80a1-68d77abb3616", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 11, "who": "Reader 11", "quote": "Before that it would hurt just to walk up and down stairs.", "source": "nyt_units", "comment_id": "154124663", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivgbn?rsrc=cshare"}, {"n": 12, "who": "Reader 12", "quote": "All it did was hurt my stomach.", "source": "wapo_units", "comment_id": "cc8f18a9-4d2e-4c07-8981-efb9dc912b9d", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 13, "who": "Reader 13", "quote": "I once met an orthopedic surgeon who said glucosamine was his 'favorite supplement'", "source": "wapo_units", "comment_id": "872f8899-5157-4ac7-95f0-4e46bf1187ae", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 14, "who": "Reader 14", "quote": "he took it for inflammation and soreness from back issues as suggesgted by a doc he respects", "source": "wapo_units", "comment_id": "0cc45b32-7e8f-4eb5-92c8-1977fd2647bc", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 15, "who": "Reader 15", "quote": "my veterinarian told me that I should give my dogs. fish oil and glucosamine because it works in them", "source": "wapo_units", "comment_id": "101b9729-acf9-47fb-b513-40784d70acf2", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 16, "who": "Reader 6", "quote": "joint pain and reduced mobility (the reason people start taking these supplements) has a bigger adverse effect on brain function than the supplement", "source": "wapo_units", "comment_id": "6dd7be25-3b96-4d6f-bbd0-e117632d3e0d", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 17, "who": "Reader 16", "quote": "the reason people use it is to relieve pain/inflammation. We suspect inflammation in the progress to dementia", "source": "wapo_units", "comment_id": "05df45be-531f-40ba-aa21-5fbbba702122", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 18, "who": "Reader 17", "quote": "This study reports on &quot;Glucosamine&quot; in general.", "source": "wapo_units", "comment_id": "6e039295-8ace-4b53-bfa8-2e43c73022fc", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 19, "who": "Reader 18", "quote": "a double-blind, placebo controlled study in canines with osteoarthritis that found glucosamine or chondroitin ineffective", "source": "wapo_units", "comment_id": "27dd0aa3-dce0-48cc-943c-2a3fca5dedbc", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 20, "who": "Reader 19", "quote": "Three weeks isn’t enough time to change joint architecture.", "source": "wapo_units", "comment_id": "e0494775-f72e-4287-af7f-85d433458715", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 21, "who": "Reader 20", "quote": "This paper was written by over 40 well qualfied scientists.", "source": "wapo_units", "comment_id": "55a04c26-4212-46ef-8c92-b0c7392e67d8", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 22, "who": "Reader 21", "quote": "Dr. Sun's study of glucosamine effects was not small", "source": "wapo_units", "comment_id": "b06e8b02-48bc-4522-ba35-954cbe208a07", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 23, "who": "Reader 22", "quote": "Could it be that a person who takes glucosamine for joint pain, therefore has some knowledge of health and wellness, is also more likely to go to their doctor", "source": "wapo_units", "comment_id": "7e56f9ed-ea26-4ea2-a066-cbadb0753519", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 24, "who": "Reader 23", "quote": "However was there any increased likelihood of progressing from no cognitive impairment to mild?", "source": "wapo_units", "comment_id": "c133b117-64d1-4a6b-be0e-899780c82a6e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 25, "who": "Reader 24", "quote": "If it works for dogs, why wouldn’t we try it?", "source": "wapo_units", "comment_id": "0f5f1d62-4786-4d6d-9952-94ca8a9c4682", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 26, "who": "Reader 25", "quote": "Glucosamine seems in the real world to help some and not others.", "source": "wapo_units", "comment_id": "2291aa71-88dc-4f60-a8df-5ed0c2946107", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}, {"id": "T5", "title": "Multivitamins and cognition: readers cite mixed evidence, dose worries", "health": true, "breadth": 27, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers disagree on whether multivitamins help cognition or health, with some citing studies of benefit, others citing null results, and side discussions on dosing, toxicity and necessity.", "readers": 6, "refs": [1, 2, 3, 4, 5, 6], "risk": "none", "risk_note": "Summary of disagreement; no actionable advice.", "verdict": "supported", "revised": false}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader stopped taking a multivitamin about six years ago after their primary care doctor said it was not harmful but not necessary.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "Clearly framed personal experience.", "verdict": "supported", "revised": false}, {"text": "One reader eats about 1200 calories a day, finds it impractical to meet RDAs through diet alone, and so takes a multivitamin; another reader also takes one.", "readers": 2, "refs": [7, 8], "risk": "none", "risk_note": "Personal experiences without advice.", "verdict": "supported", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that research found benefits, including an NIH-supported study of adults 65 and older in which a daily multivitamin improved a broad measure of cognitive function, and a long-term analysis of the Harvard cocoa study.", "readers": 4, "refs": [9, 1, 10, 3], "risk": "none", "risk_note": "Several readers cite studies; no instruction to act.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says science backs multivitamins for people who do not consistently eat a variety of nutritious foods.", "readers": 1, "refs": [11], "risk": "caution", "risk_note": "One reader's opinion ('I think') that most people benefit could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "One reader notes that evidence for older adults is mixed, with large studies showing no reduction in heart disease, cancer, cognitive decline or early death.", "readers": 1, "refs": [2], "risk": "none", "risk_note": "Quoted Johns Hopkins statement; consistent with mainstream guidance.", "verdict": "supported", "revised": false}, {"text": "Readers point out that individual supplements, and some vitamin D products, often contain many times the recommended daily amount, unlike a typical multivitamin.", "readers": 2, "refs": [12, 13], "risk": "none", "risk_note": "Factual observation about dosing, no instruction.", "verdict": "supported", "revised": false}, {"text": "Readers note that vitamin A is fat soluble and may be toxic as a supplement, and that fat-soluble substances are stored efficiently so it is easy to consume too much.", "readers": 2, "refs": [6, 14], "risk": "caution", "risk_note": "Toxicity claim rests on two readers' brief comments and could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "One reader says many water-soluble vitamins have limited body stores, so deficiency can develop when dietary supply is consistently too low.", "readers": 1, "refs": [15], "risk": "caution", "risk_note": "Health claim from a single reader.", "verdict": "supported", "revised": false}, {"text": "Readers say vitamins and minerals are essential to prevent deficiency diseases, and that very specific medical conditions require vitamin replacement therapy.", "readers": 2, "refs": [16, 17], "risk": "none", "risk_note": "Consistent with standard guidance.", "verdict": "supported", "revised": false}, {"text": "Readers say most vitamin products are unproven, and that many people who fall far short of the RDA for many vitamins and minerals are still healthy.", "readers": 2, "refs": [18, 19], "risk": "caution", "risk_note": "Claims that falling short of RDA is harmless rest on one or two readers and could be read as established fact.", "verdict": "supported", "revised": false}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "One reader says the article did not address multivitamin use, which would have been helpful to cover.", "readers": 1, "refs": [20], "risk": "none", "risk_note": "Comment about the article's coverage.", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether multivitamins provide real benefit", "sides": [{"text": "Readers say research shows multivitamins are beneficial, including for cognition and in older adults.", "readers": 5, "refs": [9, 1, 10, 3, 11], "risk": "caution", "risk_note": "Benefit claims are drawn from a few readers.", "verdict": "partly_supported", "revised": true}, {"text": "Multivitamins don't work, are unproven, or are unnecessary; large studies show no benefit.", "readers": 4, "refs": [2, 4, 5, 18], "risk": "caution", "risk_note": "Claims that supplements don't work rest on a few readers and could be read as established fact.", "verdict": "supported", "revised": false}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "Readers ask whether a daily multivitamin (or with fish oil) is harmful.", "readers": 2, "refs": [21, 22], "risk": "none", "risk_note": "Questions only.", "verdict": "supported", "revised": false}, {"text": "One reader asks why some products contain B vitamins far above 100% of the RDA.", "readers": 1, "refs": [23], "risk": "none", "risk_note": "A question only.", "verdict": "supported", "revised": false}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "One reader suggests that only fat-soluble vitamins be taken with a doctor's advice, if at all.", "readers": 1, "refs": [24], "risk": "caution", "risk_note": "Single reader's advice about supplement use.", "verdict": "supported", "revised": false}, {"text": "One reader advises not overdoing vitamins and taking them with fatty food.", "readers": 1, "refs": [25], "risk": "caution", "risk_note": "Single reader's advice on supplement use.", "verdict": "supported", "revised": false}, {"text": "One reader thinks people should get their vitamin needs from food and sun where their health allows, while noting that it is different if food sources lead to deficiency.", "readers": 1, "refs": [26], "risk": "caution", "risk_note": "Single reader's view on avoiding supplements.", "verdict": "partly_supported", "revised": true}, {"text": "One reader thinks near-RDA multivitamins are preferable to those with 600% or 1000% of the daily value.", "readers": 1, "refs": [27], "risk": "none", "risk_note": "Personal preference described.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "It seems that the study’s long-term analysis shows benefits from a multivitamin/mineral supplement.", "source": "nyt_units", "comment_id": "154060474", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ithlq?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "Evidence on multivitamins for older adults is mixed: large studies show no reduction in heart disease, cancer, cognitive decline, or early death", "source": "nyt_units", "comment_id": "154063201", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itkb1?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "That study of more than 2,200 people ages 65 and older found that a daily multivitamin improved a broad measure of cognitive function.", "source": "nyt_units", "comment_id": "154083750", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu8d6?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "I don't believe that multi vitamins work.", "source": "nyt_units", "comment_id": "154051812", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it974?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "my primary care doctor told me that it wasn't harmful, but also wasn't necessary.", "source": "nyt_units", "comment_id": "154191669", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j1hpl?rsrc=cshare"}, {"n": 6, "who": "Reader 6", "quote": "Some, like vitamin A, which is fat soluble, may be toxic.", "source": "nyt_units", "comment_id": "154060547", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itho3?rsrc=cshare"}, {"n": 7, "who": "Reader 7", "quote": "My caloric intake is about 1200 calories a day.  Meeting the RDA for the essential vitamins and minerals would through diet alone would turn me into an orthorexic.", "source": "nyt_units", "comment_id": "154059211", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itgeb?rsrc=cshare"}, {"n": 8, "who": "Reader 8", "quote": "I take a multivitamin.", "source": "nyt_units", "comment_id": "154090523", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iuf0r?rsrc=cshare"}, {"n": 9, "who": "Reader 9", "quote": "Actually the most recent research did find benefits.", "source": "nyt_units", "comment_id": "154079244", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu40c?rsrc=cshare"}, {"n": 10, "who": "Reader 10", "quote": "there is sound research that multivitamins benefit older adults", "source": "nyt_units", "comment_id": "154061969", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itj4h?rsrc=cshare"}, {"n": 11, "who": "Reader 11", "quote": "I think science backs the benefits of multivitamins for those who do not consistently eat a variety of nutritious foods", "source": "nyt_units", "comment_id": "154072259", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itt63?rsrc=cshare"}, {"n": 12, "who": "Reader 12", "quote": "Just about all individual supplements (vs. a multivitamin) are many times the recommended daily amount.", "source": "nyt_units", "comment_id": "154047220", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it4nk?rsrc=cshare"}, {"n": 13, "who": "Reader 13", "quote": "A typical multivitamin might have a modest amount of Vitamin D, while some supplements contain 10x, or more, of the recommended daily allowance", "source": "wapo_units", "comment_id": "41790979-597b-403d-b964-e7558fe35ab3", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 14, "who": "Reader 14", "quote": "Whether a supplement is fat-soluable (like Omega 3) may also be a factor since the body stores those substances efficiently", "source": "wapo_units", "comment_id": "ac8d585d-5006-4b42-9247-daba556f85fb", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 15, "who": "Reader 15", "quote": "many water-soluble vitamins have relatively limited body stores", "source": "nyt_units", "comment_id": "154051796", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it96k?rsrc=cshare"}, {"n": 16, "who": "Reader 16", "quote": "vitamins and minerals are know to be essential to prevent identified acute deficiency diseases", "source": "nyt_units", "comment_id": "154105679", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iutqf?rsrc=cshare"}, {"n": 17, "who": "Reader 17", "quote": "Very specific medical conditions do require Vitamin replacement therapy.", "source": "nyt_units", "comment_id": "154076643", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu1f3?rsrc=cshare"}, {"n": 18, "who": "Reader 18", "quote": "most vitamin products are unproven", "source": "nyt_units", "comment_id": "154048454", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it5u6?rsrc=cshare"}, {"n": 19, "who": "Reader 6", "quote": "many who don't get anywhere near the RDA of many vitamins and minerals are still healthy", "source": "nyt_units", "comment_id": "154060547", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itho3?rsrc=cshare"}, {"n": 20, "who": "Reader 19", "quote": "It would have been helpful if the article addressed multi-vitamin use.", "source": "wapo_units", "comment_id": "a4d57df0-3321-4a2f-adab-be5fc4f562bc", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 21, "who": "Reader 20", "quote": "What harm can my one-a-day vitamin and my fish oil capsules do me?", "source": "nyt_units", "comment_id": "154050347", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it7pb?rsrc=cshare"}, {"n": 22, "who": "Reader 19", "quote": "Are multi-vitamins a bad thing for people to be taking daily?", "source": "wapo_units", "comment_id": "a4d57df0-3321-4a2f-adab-be5fc4f562bc", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 23, "who": "Reader 21", "quote": "Costco Kirkland multi chewy has 3000% of vitamin B. Why?", "source": "wapo_units", "comment_id": "c67bf4b3-d18f-4d45-9529-6da3af2e6a1d", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 24, "who": "Reader 22", "quote": "One should only take fat soluble vitamins with a doctor's advice, if at all.", "source": "wapo_units", "comment_id": "40c19347-7208-4455-9b69-32a333991a7b", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 25, "who": "Reader 23", "quote": "don't over do it either and take the vitamins with fatty food it helps carry the nutrients", "source": "nyt_units", "comment_id": "154087982", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iuche?rsrc=cshare"}, {"n": 26, "who": "Reader 24", "quote": "If our health allows for it, and we can obtain most of our vitamin needs by food and sun, I think we should.", "source": "wapo_units", "comment_id": "b7ad9b6d-da92-471e-9d45-a96ec29693d6", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 27, "who": "Reader 25", "quote": "Why would you need such an excess, especially considering that you're also eating food?", "source": "nyt_units", "comment_id": "154057591", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itern?rsrc=cshare"}]}, {"id": "T6", "title": "Supplements in older age: caution, protein, and absorption", "health": true, "breadth": 24, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers are divided between urging caution about supplements as people age and arguing that older adults may need them, citing protein needs, reduced absorption, and changing nutrient requirements.", "readers": 5, "refs": [1, 2, 3, 4, 5], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader, an octogenarian, says they are not sure it is possible to stay healthy into old age without taking any medication, though some few individuals might manage it.", "readers": 1, "refs": [6], "risk": "caution", "risk_note": "Claims medication is usually needed for longevity; the comment is about medication (statins etc.), not supplements, and rests on one person.", "verdict": "partly_supported", "revised": true}, {"text": "A reader aged 83 says they do not have time to wait for gold-standard research before taking supplements.", "readers": 1, "refs": [7], "risk": "caution", "risk_note": "Describes taking 35 supplements every three days; could be read as encouragement, though framed as personal experience.", "verdict": "supported", "revised": false}, {"text": "One reader says they will stick with supplements until there is more proof that they don't work for someone older than 74.", "readers": 1, "refs": [8], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that digestion and absorption become less efficient with age, including for B vitamins and magnesium, and that older people may not eat enough food to get sufficient nutrients.", "readers": 2, "refs": [9, 10], "risk": "caution", "risk_note": "Absorption claims about B vitamins/magnesium rest on a duplicated comment and could be read as established fact.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says some substances, particularly for older people, cannot be obtained from diet and must come from supplements.", "readers": 1, "refs": [11], "risk": "caution", "risk_note": "Claims NAD/NMN cannot be obtained from diet and must be supplemented; a single reader's claim that could be read as fact.", "verdict": "supported", "revised": false}, {"text": "Readers point out that nutrient needs change with age and differ at different life stages.", "readers": 2, "refs": [5, 12], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers say older adults need more protein to hold off sarcopenia and muscle loss, and that many do not get enough protein or calcium. One cites reputable sources recommending closer to 100 grams of protein a day along with resistance training.", "readers": 3, "refs": [13, 14, 15], "risk": "caution", "risk_note": "Specific protein quantity (100 g/day) from one reader; higher than standard guidance for many people.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says protein supplements are not warranted for older adults who are not doing the work to retain or build muscle.", "readers": 1, "refs": [16], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader notes that a healthy diet and other factors play a role in longevity, not just supplements.", "readers": 1, "refs": [17], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says a healthy 85-year-old may indeed need a supplement for health.", "readers": 1, "refs": [18], "risk": "caution", "risk_note": "Suggests healthy older people may need supplements; based on one comment.", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether older adults should take supplements, particularly protein, or be cautious about them", "sides": [{"text": "Caution about supplements is warranted, and lifestyle and diet should be the focus.", "readers": 3, "refs": [1, 2, 19], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "Some readers say older adults may need supplements, such as protein, because of muscle loss, poorer absorption, or changing needs.", "readers": 4, "refs": [18, 3, 20, 13], "risk": "caution", "risk_note": "Suggests older adults need supplements and should not wait for research; could conflict with cautious medical guidance.", "verdict": "partly_supported", "revised": true}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "One reader notes that researchers are questioning whether our bodies process supplements differently as we get older.", "readers": 1, "refs": [21], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "One reader doubts the medical establishment has distinguished the nutrient amounts needed to sustain life from those needed to thrive, especially with aging.", "readers": 1, "refs": [22], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "One reader suggests that with age the focus should be heavily on lifestyle, diet, exercise, and blood pressure that is neither too low nor too high, with changes evaluated by a doctor.", "readers": 1, "refs": [19], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Two readers say it is good to question the effects of supplements on an aging body and that caution with supplements is warranted as one ages.", "readers": 2, "refs": [1, 2], "risk": "none", "risk_note": "", "verdict": "supported", "revised": true}, {"text": "One reader says protein supplements are better than skipping a meal for older people who do not get enough protein.", "readers": 1, "refs": [20], "risk": "caution", "risk_note": "A physician-identified reader says protein supplements beat skipping meals; a single-reader health claim.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "I think it is good to question the effects of supplements on an aging body.", "source": "wapo_units", "comment_id": "cb693e01-ffc1-4c7d-b79b-e8b83b06b698", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 2, "who": "Reader 2", "quote": "Clearly, caution with supplements is warranted, especially as one ages.", "source": "wapo_units", "comment_id": "4a0c32bb-1d1c-4dff-a48a-bf6c2d9ba495", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 3, "who": "Reader 3", "quote": "you think protein supplements aren’t warranted?", "source": "nyt_units", "comment_id": "154085646", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iua8e?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "digestion/absorption in older people", "source": "nyt_units", "comment_id": "154066930", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itnvi?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "as we age our needs for nutrients may change", "source": "wapo_units", "comment_id": "33056310-7319-4776-8acf-32eedb0a94ba", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "I am not so sure it is possible for an octogenerian (such as me) without taking any medication.", "source": "nyt_units", "comment_id": "154068265", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itp99?rsrc=cshare"}, {"n": 7, "who": "Reader 7", "quote": "I’m 83, so I don’t have time to wait for gold standard research", "source": "nyt_units", "comment_id": "154101959", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iuq67?rsrc=cshare"}, {"n": 8, "who": "Reader 8", "quote": "I think I'll stick with the supplements until more proof that they don't work on someone older than 74.", "source": "wapo_units", "comment_id": "0d73a117-3f45-4f91-bfb3-e684078d4566", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 9, "who": "Reader 9", "quote": "As we get older we don't as good of job digesting our food and absorbing nutrients", "source": "nyt_units", "comment_id": "154046791", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it4a7?rsrc=cshare"}, {"n": 10, "who": "Reader 10", "quote": "Many nutrients are less well absorbed by the older adult, including B vitamins and magnesium.", "source": "nyt_units", "comment_id": "154039613", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ist9t?rsrc=cshare"}, {"n": 11, "who": "Reader 11", "quote": "there are other substances, particularly for older people, that cannot be derived from diet", "source": "nyt_units", "comment_id": "154063479", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itkjn?rsrc=cshare"}, {"n": 12, "who": "Reader 12", "quote": "people need different levels of vitamins and minerals at different ages", "source": "wapo_units", "comment_id": "51acc8c6-854e-4552-aafb-54f6ebe02a7e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 13, "who": "Reader 13", "quote": "many reputable sources recommend that seniors get closer to 100 grams of protein per day", "source": "nyt_units", "comment_id": "154055705", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itd0p?rsrc=cshare"}, {"n": 14, "who": "Reader 14", "quote": "whether or not most of them get those amounts (spoiler: no)", "source": "nyt_units", "comment_id": "154082223", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu6tf?rsrc=cshare"}, {"n": 15, "who": "Reader 15", "quote": "seniors do in fact need more protein to hold off sarcopenia", "source": "nyt_units", "comment_id": "154135590", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivr16?rsrc=cshare"}, {"n": 16, "who": "Reader 16", "quote": "Not if youre not doing the work to retain/build muscle.", "source": "nyt_units", "comment_id": "154090473", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iuev9?rsrc=cshare"}, {"n": 17, "who": "Reader 17", "quote": "Healthy diet as well as other factors play a role not just the supplements", "source": "nyt_units", "comment_id": "154189551", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j1fnf?rsrc=cshare"}, {"n": 18, "who": "Reader 10", "quote": "This means that a healthy 85 year old may indeed require a supplement for health.", "source": "nyt_units", "comment_id": "154039613", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ist9t?rsrc=cshare"}, {"n": 19, "who": "Reader 18", "quote": "the focus should be heavily upon lifestyle, diet, exercise, and blood pressure (neither too low nor too high) with changes evaluated by one's doctor.", "source": "wapo_units", "comment_id": "11376a40-aab0-4351-8f92-fcfcc413928e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 20, "who": "Reader 19", "quote": "I do feel it is better than skipping a meal; many elderly people do not get enough protein in your diet.", "source": "nyt_units", "comment_id": "154083750", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu8d6?rsrc=cshare"}, {"n": 21, "who": "Reader 20", "quote": "they are questioning if our bodies process supplements differently as we get older", "source": "wapo_units", "comment_id": "e077715f-1481-4ff6-82b2-0b377a21365f", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 22, "who": "Reader 21", "quote": "I am no longer sure that the medical establishment has distinguised between the amount necessary to sustain life functions, and the amount necessary to actually thrive, particularly as we age.", "source": "nyt_units", "comment_id": "154073054", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ittuu?rsrc=cshare"}]}, {"id": "T7", "title": "Omega-3 supplements: fish, algae, flax and what the evidence shows", "health": true, "breadth": 21, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers disagree over whether omega-3 supplements help the heart, and they debate sources (fish, algae, flax, purified forms) and whether fish oil's effects come from omega-3s alone.", "readers": 6, "refs": [1, 2, 3, 4, 5, 6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader takes an algae-derived omega-3 supplement because they avoid fish for environmental reasons.", "readers": 1, "refs": [7], "risk": "none", "risk_note": "Personal experience.", "verdict": "supported", "revised": false}, {"text": "A longtime vegetarian chose algae-based omega-3 supplements and says their triglycerides sometimes still run high.", "readers": 1, "refs": [8], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "One reader says the source of omega supplements is a problem because fish are at the top of the food chain and so toxic, and that getting omega-3 from algae is better.", "readers": 1, "refs": [4], "risk": "caution", "risk_note": "Toxicity claim about fish-derived supplements rests on one reader's assertion.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says purified versions of omega-3s are available, and another notes that results with fish oil may differ from those with DHA or EPA alone.", "readers": 2, "refs": [9, 10], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader wonders whether fish oil's apparent benefit may come from another component of fish, and another wonders whether it reflects socioeconomic differences in who eats fish rather than omega-3s themselves.", "readers": 2, "refs": [11, 5], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "One reader says that more than 10 years ago it was proven that omega-3 fish oil supplements give no benefit.", "readers": 1, "refs": [12], "risk": "caution", "risk_note": "Single reader's flat claim that fish oil has no benefit could be read as fact.", "verdict": "supported", "revised": false}, {"text": "One reader says most omega-3 supplements are fish oils rather than flax seed oil.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader points out that omega-3 fatty acids are highly unsaturated and so extremely susceptible to oxidation.", "readers": 1, "refs": [13], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says omega-3s are a large class of molecules differing mainly by chain length, so the article treats them too coarsely.", "readers": 1, "refs": [14], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says long-chain omega-3s such as EPA are mostly converted into resolvins, which act as inflammation terminators.", "readers": 1, "refs": [15], "risk": "caution", "risk_note": "Biochemical claim from one reader presented as fact.", "verdict": "supported", "revised": false}, {"text": "A doctor says earlier studies showed benefit and cardiologists first promoted a high-dose prescription omega-3, but advice changed as later studies appeared.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "Readers object that listing an increased risk of atrial fibrillation as a benefit of omega-3s is contradictory.", "readers": 2, "refs": [16, 17], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether omega-3 supplements benefit the heart", "sides": [{"text": "One reader says omega-3s give major benefits, such as lowering triglycerides and supporting heart health.", "readers": 1, "refs": [1], "risk": "caution", "risk_note": "Health benefit claim rests on one reader.", "verdict": "partly_supported", "revised": true}, {"text": "Two readers say omega-3 supplements for preventing heart disease have been disproven or shown to have no benefit.", "readers": 2, "refs": [2, 12], "risk": "caution", "risk_note": "Claim that omega-3s are disproven for heart disease conflicts somewhat with guidance (e.g., prescription EPA for high triglycerides), and rests on few readers.", "verdict": "partly_supported", "revised": true}]}, {"issue": "Whether omega-3s raise atrial fibrillation risk", "sides": [{"text": "Omega-3 fatty acids may increase the risk of atrial fibrillation, a dangerous irregular heart rhythm.", "readers": 1, "refs": [18], "risk": "caution", "risk_note": "Afib risk is a real documented concern at high doses; reader says only 'may'.", "verdict": "supported", "revised": false}, {"text": "This is confusing or contradictory when it is presented as a benefit.", "readers": 2, "refs": [16, 17], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "Do omega-3 supplements include flax seed?", "readers": 1, "refs": [19], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Is fish oil's benefit due to some other component in fish rather than omega-3s alone?", "readers": 1, "refs": [5], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "Studies of omega-3 supplements should use algae oil pills instead of fish oil.", "readers": 1, "refs": [20], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader suggests another commenter consider flax seeds instead of fish oil, after checking their nutritional value and talking with her ophthalmologist.", "readers": 1, "refs": [21], "risk": "caution", "risk_note": "Suggests substituting flax seeds for fish oil taken for macular degeneration; flax is not equivalent, though the reader advises consulting the ophthalmologist.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Omega-3 fatty acids provide major health benefits, especially by lowering triglyceride levels and supporting heart health.", "source": "wapo_units", "comment_id": "86b4cbe6-a9bf-4cea-bbd9-fce73d54e8cf", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 2, "who": "Reader 2", "quote": "preventing heart disease (long disproven at this point)", "source": "nyt_units", "comment_id": "154078083", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu2s3?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "earlier studies showed benefit for omega 3s and even cardiologists originally trumpeted a prescription high dose omega 3.", "source": "nyt_units", "comment_id": "154081183", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu5sv?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "Getting it from algae better.", "source": "wapo_units", "comment_id": "f430b699-d31f-4e4e-981b-9298b80da3a5", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 5, "who": "Reader 5", "quote": "What if it's only good in conjunction with something else found in fish?", "source": "wapo_units", "comment_id": "dc70e1c6-e03b-44ef-85b5-eb8cd1324200", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "q who": "Reader 11", "quote": "It could be mostly or exclusively down to that, and all this drama about Omega-3s being magic was all false.", "source": "wapo_units", "comment_id": "23f19eb2-d8eb-42df-991c-1656ac896d08", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 12, "who": "Reader 12", "quote": "It was proven more than 10 years ago that there is no benefit from taking Omega 3 fish oil supplements.", "source": "wapo_units", "comment_id": "ca59800f-be7b-476e-823e-dd507dc9c754", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 13, "who": "Reader 13", "quote": "Omega-3 fatty acids (because they are highly unsaturated) are extremely susceptible to oxidation", "source": "wapo_units", "comment_id": "11a4da76-4569-4611-9d51-b6fafd17841e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 14, "who": "Reader 14", "quote": "What a coarse presentation. omega 3 fatty acids are a large class of biomoleculee, mostly differentiated by chain length (c atoms).", "source": "wapo_units", "comment_id": "d063c6d3-b2a0-4438-9246-79a3843dd825", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 15, "who": "Reader 14", "quote": "The latter are mostly converted to resolving that act as inflammation terminators.", "source": "wapo_units", "comment_id": "d063c6d3-b2a0-4438-9246-79a3843dd825", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 16, "who": "Reader 15", "quote": "Two benefits? You say it may increase the risk of afib.", "source": "wapo_units", "comment_id": "3da77433-f541-47d7-88fe-b8451f78b6be", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 17, "who": "Reader 16", "quote": "How does \"it may increase the risk of developing atrial fibrillation\" aqua; a benefit?", "source": "wapo_units", "comment_id": "2a9d7fb8-282c-4919-accf-07be75baedc8", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 18, "who": "Reader 1", "quote": "it may increase the risk of developing atrial fibrillation, an irregular and potentially dangerous heart rhythm.", "source": "wapo_units", "comment_id": "86b4cbe6-a9bf-4cea-bbd9-fce73d54e8cf", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 19, "who": "Reader 17", "quote": "Do omega 3 supplements include flax seed?", "source": "wapo_units", "comment_id": "44314d37-2d2e-41d0-af11-f18532f065be", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 20, "who": "Reader 18", "quote": "Studies on omega-3 supplements should use algae oil pills instead", "source": "wapo_units", "comment_id": "5ac3dcdb-5d77-46d3-90b3-4371fd444bfe", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 21, "who": "Reader 19", "quote": "@Amanda S. might you consider flax seeds instead after checking into their nutritional value", "source": "nyt_units", "comment_id": "154080475", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu56r?rsrc=cshare"}]}, {"id": "T8", "title": "Small samples and confounders in supplement studies", "health": true, "breadth": 13, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Several readers doubt the supplement findings, citing small samples, possible measurement error and uncontrolled lifestyle factors, while others ask for more detail about the studies; one reader argues the findings are worth further consideration and urges keeping up with the literature.", "readers": 7, "refs": [1, 2, 3, 4, 5, 6, 7], "risk": "none", "risk_note": "No actionable health advice.", "verdict": "partly_supported", "revised": true}, "status": "review", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that lifestyle differences between people who take supplements and those who don't are a major confounding variable in supplement studies.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "Statement about study methodology.", "verdict": "supported", "revised": false}, {"text": "One reader asks how a supplement could alter being overweight and unfit, which they attribute to a sedentary lifestyle.", "readers": 1, "refs": [8], "risk": "none", "risk_note": "Rhetorical question, not advice.", "verdict": "partly_supported", "revised": true}, {"text": "Two readers say the studies have small samples; one says such studies don't mean much, and another says the overall sample is very small.", "readers": 2, "refs": [3, 4], "risk": "none", "risk_note": "No actionable health advice.", "verdict": "partly_supported", "revised": true}, {"text": "A commenter who says they research fatty acids says the published supplement studies may contain substantial measurement errors.", "readers": 1, "refs": [2], "risk": "caution", "risk_note": "Claim about rancid fish oil and study quality rests on one person's suspicion and could be read as fact.", "verdict": "supported", "revised": false}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "A physician who says they design clinical trials argues the article focuses on small observational studies whose findings can be misleading, and says the writer needs to be educated about statistical power.", "readers": 1, "refs": [1], "risk": "none", "risk_note": "No actionable health advice.", "verdict": "partly_supported", "revised": true}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether the findings should be shared now", "sides": [{"text": "Sharing the results is premature and potentially harmful until a statistically significant number of humans is included.", "readers": 1, "refs": [9], "risk": "none", "risk_note": "Opinion about publication.", "verdict": "supported", "revised": false}, {"text": "One reader says people should remain educated and keep up with the literature to see where it heads, rather than being afraid of new information, and finds the results worthy of further consideration.", "readers": 1, "refs": [10], "risk": "none", "risk_note": "No actionable health advice.", "verdict": "partly_supported", "revised": true}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "Did the researchers control for other changes in participants' behavior, such as exercise, sun exposure or eating more vitamin D-rich foods?", "readers": 1, "refs": [6], "risk": "none", "risk_note": "Question only.", "verdict": "partly_supported", "revised": true}, {"text": "Were the study participants healthy?", "readers": 1, "refs": [11], "risk": "none", "risk_note": "Question only.", "verdict": "supported", "revised": false}, {"text": "One reader asks about the number of subjects and design of the studies, and another asks who the scientists behind them are.", "readers": 2, "refs": [7, 12], "risk": "none", "risk_note": "Questions only.", "verdict": "partly_supported", "revised": true}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "Take medical advice from your own attending GP rather than from this report.", "readers": 1, "refs": [13], "risk": "caution", "risk_note": "Mild advice to rely on one's GP, consistent with general guidance.", "verdict": "supported", "revised": false}, {"text": "Stay educated and follow the literature to see where it heads, rather than dismissing or accepting the findings right away.", "readers": 1, "refs": [10], "risk": "none", "risk_note": "Advice to stay informed.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "This medical writer needs to be educated regarding the statistical power of these small \"click bait\" studies", "source": "wapo_units", "comment_id": "1c515e00-cc85-490d-a54b-f557edd6d0c3", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 2, "who": "Reader 2", "quote": "A problem with this article and published studies is that there may be substantial measurement errors.", "source": "wapo_units", "comment_id": "e0581f47-f604-479b-9960-c2699c3e50d2", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 3, "who": "Reader 3", "quote": "These studies that are on small samples don’t mean much.", "source": "wapo_units", "comment_id": "60800c0d-c408-4f2f-9e61-51193161ec48", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "A very small sample of people overall.", "source": "wapo_units", "comment_id": "3f06c8d4-beb8-46d3-81c2-0457c48c80c3", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 5, "who": "Reader 5", "quote": "The differences in lifestyles between people who choose to take supplements and those who do not make that choice is a huge confounding variable.", "source": "wapo_units", "comment_id": "355f1484-309c-49b4-af61-1abe4b21ba19", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "Did they exercise more — get more sunshine — eat foods with more Vitamin D?", "source": "wapo_units", "comment_id": "aefe6dc8-71a5-4b7c-90df-c9f27ae71f76", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 7, "who": "Reader 7", "quote": "I don’t see the number of subjects or the design of these studies. We need more information", "source": "wapo_units", "comment_id": "6dd10802-ae85-42e4-87ec-6344dce42eea", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 8, "who": "Reader 8", "quote": "How could a supplement alter those effects..of a sedentary lifestyle...?", "source": "nyt_units", "comment_id": "154083186", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu7ri?rsrc=cshare"}, {"n": 9, "who": "Reader 9", "quote": "sharing the results is premature and potentially harmful", "source": "wapo_units", "comment_id": "51acc8c6-854e-4552-aafb-54f6ebe02a7e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 10, "who": "Reader 10", "quote": "You could remain educated and keep up with the literature see where it heads.", "source": "wapo_units", "comment_id": "eca14f30-11b6-4e6b-a8a7-6a074286be9e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 11, "who": "Reader 11", "quote": "Are the people in the study healthy?", "source": "wapo_units", "comment_id": "272352f1-504c-489b-b04f-b793c24e7374", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 12, "who": "Reader 12", "quote": "Who are these scientists?", "source": "wapo_units", "comment_id": "0d1a158d-c6ae-40b4-b2f1-287b8d19806e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 13, "who": "Reader 13", "quote": "I’ll take my medical advice from my attending GP, and NOT from this report that has small sample size study.", "source": "wapo_units", "comment_id": "44435f7f-4f32-41b1-bc78-a1810d4a1573", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}, {"id": "T9", "title": "Doctors' nutrition training and access to nutrition specialists", "health": true, "breadth": 11, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Most readers say doctors get little nutrition training and point to specialists or dietitians, though access is uneven and one reader says nutrition is taught at Harvard.", "readers": 9, "refs": [1, 2, 3, 4, 5, 6, 7, 8, 9], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader says their own doctors embrace integrative medicine and appreciate nutrition expertise.", "readers": 1, "refs": [10], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says that when their mother had kidney failure and was not a dialysis candidate, her physicians could not direct the family to a nutrition specialist. One would have been offered only if she were on dialysis.", "readers": 1, "refs": [11], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that doctors get very little nutrition training, perhaps several weeks, often in online modules. They say most doctors are therefore not well placed to give nutritional advice and refer patients to dietitians.", "readers": 3, "refs": [2, 3, 4], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says Physician Nutrition Specialists could bridge the knowledge gap, but there are not enough of them.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says that in rural western states, arranging a dietitian consultation through a doctor's office is not how care works.", "readers": 1, "refs": [8], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says older MDs sometimes have limited nutrition knowledge, while DOs have a longer history of including nutrition in their medical school curricula.", "readers": 1, "refs": [12], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says Americans rarely make nutrition-focused appointments with their primary care physicians.", "readers": 1, "refs": [13], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "One reader counters that Harvard Medical School has an entire Division of Nutrition with coursework, so nutrition is taught in medical school.", "readers": 1, "refs": [9], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether nutrition is adequately taught in medical school", "sides": [{"text": "Medical training needs improvement on nutrition. Doctors get little or almost no nutrition training.", "readers": 4, "refs": [1, 2, 3, 4], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Nutrition is taught in medical school, for example at Harvard's Division of Nutrition, and DOs have long included it.", "readers": 2, "refs": [9, 12], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"issue": "Whether patients can easily get a dietitian referral through their doctor", "sides": [{"text": "Patients can ask their doctor's office to arrange a dietitian consultation.", "readers": 1, "refs": [7], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "In rural western states, this is not how care works.", "readers": 1, "refs": [8], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "Patients can ask their doctor's office to arrange a consultation with a dietitian to discuss their concerns.", "readers": 1, "refs": [7], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "For specific supplement needs, consulting specialists experienced in nutrition is more accurate and helpful than relying on general assessments.", "readers": 1, "refs": [14], "risk": "caution", "risk_note": "Supplement-related advice resting on one reader's opinion could be read as established fact.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Medical training needs to be improved regarding this.", "source": "nyt_units", "comment_id": "154066878", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https:/
