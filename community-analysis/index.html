ral times and Medicare covered it when used to investigate possibly related symptoms, not as routine screening.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says their vitamin D was not retested at later annual exams because insurance would not pay for another test after the initial one.", "readers": 1, "refs": [7], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers state that Medicare covers vitamin D level tests.", "readers": 2, "refs": [2, 4], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader points out that Medicare does not cover vitamin D lab tests without a documented medical issue, so checking one's level without a clinical reason is hard.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether Medicare covers vitamin D tests routinely or only with a medical reason", "sides": [{"text": "Coverage is available, including routine yearly testing.", "readers": 4, "refs": [1, 2, 4, 6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Coverage depends on a documented medical issue or symptoms, or may not extend to repeat tests.", "readers": 3, "refs": [3, 5, 7], "risk": "none", "risk_note": "Different points but all fit the 'restricted coverage' side.", "verdict": "partly_supported", "revised": false}]}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "My lab tests always include a vitamin D test and I am on a Medicare advantage plan.", "source": "wapo_units", "comment_id": "17d33c97-b969-4752-a7f0-117b3523ca2b", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 2, "who": "Reader 2", "quote": "It's a covered test. I'm on Medicare, too.", "source": "wapo_units", "comment_id": "db721fe9-0b29-487c-b64d-e619565eeb1e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 3, "who": "Reader 3", "quote": "Too bad Medicare doesn't cover such tests unless there's an issue", "source": "wapo_units", "comment_id": "2cbb97d5-3195-4621-9a23-27cc28f11f2c", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "Medicare definitely does cover it. My vitamin D levels are routinely checked every year.", "source": "wapo_units", "comment_id": "4dc9ddb3-bbfb-495b-9416-63db49aaa20e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 5, "who": "Reader 5", "quote": "Medicare covered it, not as a routine test but to investigate symptoms that may have been related to my Vitamin D level.", "source": "wapo_units", "comment_id": "11eb8a1e-fb28-440c-bd0f-690c93b07bc6", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "I'm on regular Medicare and I get tested for Vitamin D every year. It's covered.", "source": "wapo_units", "comment_id": "93c826eb-437e-41ec-ae3d-fc320f0f06ca", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 7, "who": "Reader 7", "quote": "The test was never repeated at subsequent annual exams.", "source": "nyt_units", "comment_id": "154133610", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivp3a?rsrc=cshare"}]}, {"id": "T21", "title": "Supplements vs. whole foods, and why stores stock them", "health": true, "breadth": 9, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Several readers favour whole foods over most supplements, though one reader urges looking at lifestyle overall and another allows quality supplements for some needs.", "readers": 6, "refs": [1, 2, 3, 4, 5, 6], "risk": "none", "risk_note": "General summary of opinions.", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "One reader says food contains trace elements that can't be found elsewhere, so eating healthy food is wiser than taking a multivitamin, which their doctors do not recommend.", "readers": 1, "refs": [2], "risk": "caution", "risk_note": "Claim about trace elements and multivitamins rests on one reader and could be read as established fact.", "verdict": "partly_supported", "revised": true}, {"text": "Readers point out that all supermarkets and food stores carry supplements, and that stores likely would not give the aisle space to them if sales were weak.", "readers": 3, "refs": [7, 8, 9], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says Whole Foods stocks supplements to sell items at a profit, not to provide nourishing food.", "readers": 1, "refs": [10], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether to focus on supplements versus food or on the broader lifestyle", "sides": [{"text": "One reader says taking vitamins is an inefficient strategy when the same benefits can be had directly from fresh whole foods.", "readers": 1, "refs": [1], "risk": "caution", "risk_note": "Claim about vitamin efficiency rests on one reader and could be read as fact.", "verdict": "partly_supported", "revised": true}, {"text": "A whole-foods lifestyle involves more interconnected variables than can be counted, so the whole lifestyle should be considered rather than individual supplements.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "Get antioxidants, protein and vitamins from whole foods such as Greek yogurt, frozen berries, cherries, salads, and chicken or tofu rather than from supplements.", "readers": 1, "refs": [5], "risk": "caution", "risk_note": "One reader's dietary advice claiming whole foods provide all the protein, vitamins and antioxidants needed; could be read as general medical advice.", "verdict": "supported", "revised": false}, {"text": "If you have allergies or don't get enough nutrients from food, buy a quality supplement rather than the cheapest one.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "Mild advice to choose quality products.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Taking vitamins when you can get the benefits directly from fresh whole foods is an inefficient strategy", "source": "nyt_units", "comment_id": "154063479", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itkjn?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "It's far wiser to eat healthy food because trace elements exist in them that you won't find elsewhere.", "source": "nyt_units", "comment_id": "154332985", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j5rpp?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "A whole-foods, wholesome lifestyle has more interconnected variables than you can count", "source": "wapo_units", "comment_id": "7f24487b-d5dc-4d0f-9360-aea8e03f8ebc", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "If you have allergies or just don't get enough from food, be sure you buy a quality supplement not just the cheapest", "source": "nyt_units", "comment_id": "154047590", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it536?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "That's all the protein, vitamins and antioxidants you need.", "source": "nyt_units", "comment_id": "154044143", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it1nf?rsrc=cshare"}, {"n": 6, "who": "Reader 6", "quote": "The stuff at the vitamin store is just a bunch of overpriced feel good woowoo.", "source": "nyt_units", "comment_id": "154081718", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu6dm?rsrc=cshare"}, {"n": 7, "who": "Reader 7", "quote": "All food stores have aisles of supplements, as well as lots of other useless junk.", "source": "nyt_units", "comment_id": "154079319", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu42n?rsrc=cshare"}, {"n": 8, "who": "Reader 8", "quote": "The sales numbers likely contradict your POV. If the sales weren't hitting an acceptable baseline they would remerchandize  the aisles.", "source": "nyt_units", "comment_id": "154090880", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iufc0?rsrc=cshare"}, {"n": 9, "who": "Reader 9", "quote": "It's true, all supermarkets sell supplements.", "source": "nyt_units", "comment_id": "154107891", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iuvvj?rsrc=cshare"}, {"n": 10, "who": "Reader 9", "quote": "Their motive is selling items at a profit.", "source": "nyt_units", "comment_id": "154107857", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iuvuh?rsrc=cshare"}]}, {"id": "T22", "title": "Placebo effect as an explanation for supplement benefits", "health": true, "breadth": 9, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers broadly agree the placebo effect is real and may explain why people feel supplements help, though some think supplement users overlook it.", "readers": 6, "refs": [1, 2, 3, 4, 5, 6], "risk": "caution", "risk_note": "Suggests supplement benefits may be placebo, based on a few readers' opinions; could be read as established fact.", "verdict": "supported", "revised": false}, "status": "review", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "Readers say the placebo effect can be real; one adds that it can produce real changes over time, while another notes that placebo effects can wear off.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "One reader notes that even telling people they are taking a placebo pill still produces some benefit to a degree.", "readers": 1, "refs": [1], "risk": "none", "risk_note": "Reader relays a magazine report; no advice given.", "verdict": "supported", "revised": false}, {"text": "Readers suggest the placebo effect may explain why people feel benefits from supplements, with one considering it very strong.", "readers": 2, "refs": [3, 6], "risk": "caution", "risk_note": "Attributes supplement benefits to placebo based on two readers' views; could be read as established fact.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Even telling the person this is a placebo pill works [and they take the pill] works to some degree", "source": "nyt_units", "comment_id": "154049881", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it7ap?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "the placebo effect can be real in some instances", "source": "nyt_units", "comment_id": "154074227", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itv3j?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "Perhaps the \"placebo effect\" comes into play.", "source": "nyt_units", "comment_id": "154075236", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu034?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "few supplement users have heard of the placebo effect", "source": "nyt_units", "comment_id": "154259279", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j3jqf?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "the placebo effect can over time produce real changes", "source": "wapo_units", "comment_id": "e0494775-f72e-4287-af7f-85d433458715", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "Placebo effect is so strong.", "source": "nyt_units", "comment_id": "154083615", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu88v?rsrc=cshare"}]}, {"id": "T23", "title": "Imperfect diets: common, hard to fix, hard to study", "health": true, "breadth": 8, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers note that most people do not eat perfectly and that there may be no single perfect diet; one says healthy eating is easy to plan, another says they cannot eat enough food to meet recommendations, and another says nutrition trials are very hard to run.", "readers": 5, "refs": [1, 2, 3, 4, 5], "risk": "none", "risk_note": "Discussion of diet; no actionable medical advice.", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "One reader points out that most people do not eat perfectly, so many diets fall short of ideal recommendations.", "readers": 1, "refs": [2], "risk": "none", "risk_note": "", "verdict": "supported", "revised": true}, {"text": "One reader points out that randomized trials are remarkably difficult, almost impossible, for nutrition because there is no way to control everything participants eat.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader notes that lifestyle or diet choices can limit proper nutritional levels in some cases.", "readers": 1, "refs": [6], "risk": "caution", "risk_note": "General health claim from a single reader; mild and consistent with general knowledge.", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "How feasible it is to meet healthy-eating recommendations", "sides": [{"text": "Eating healthy is not hard; a little weekly planning and shopping is enough.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Covering all recommended nutrients or servings in a day is not possible for this reader.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "Personal experience.", "verdict": "supported", "revised": false}]}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "One reader suggests that eating healthy is not that hard and only takes a little time once a week to plan meals and shop.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "there's no such a thing as a \"perfect diet\"", "source": "nyt_units", "comment_id": "154105741", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iutsd?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "Most of us don't eat perfectly.", "source": "nyt_units", "comment_id": "154090523", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iuf0r?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "It's not that hard to spend a little time once a week to figure out what healthy foods you are going to eat that week", "source": "nyt_units", "comment_id": "154041437", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4isv2t?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "I personally cant consume enough food in a day to cover all the nutrients or recommended servings", "source": "nyt_units", "comment_id": "154201223", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j1r47?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "RCTs are remarkably difficult, almost impossible, to do for nutrition and diet. Reason being, there's o way to control everything that a person in the trial eats.", "source": "wapo_units", "comment_id": "5e905155-85b6-4791-b382-5f66103eb7bb", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "there could be lifestyle or diet choices that limit proper nutritional levels", "source": "wapo_units", "comment_id": "122dd8dc-689c-448d-ab28-5d9d97c05c80", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}, {"id": "T24", "title": "Do calcium supplements help bones? Readers weigh evidence, food and alternatives", "health": true, "breadth": 8, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Some readers say studies show calcium supplements do little for bones, while others say calcium still matters, and some suggest food sources, vitamin K or algae-based products.", "readers": 6, "refs": [1, 2, 3, 4, 5, 6], "risk": "caution", "risk_note": "Summarises claims about supplement efficacy that rest on few readers; could be read as established fact.", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader says their cardiologist told them to stop taking calcium supplements.", "readers": 1, "refs": [7], "risk": "caution", "risk_note": "Reports a cardiologist's advice to stop a supplement; readers could act on it without context, though it is framed as personal experience.", "verdict": "supported", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers say the latest studies show calcium supplements do not meaningfully help bone health. One adds that they raise bone mass by 3% at most and do not affect fracture incidence.", "readers": 2, "refs": [1, 2], "risk": "caution", "risk_note": "Rests on two comments, one of which only agrees; the claim that supplements do not affect fractures could be read as established fact.", "verdict": "supported", "revised": true}, {"text": "One reader points out that vitamin K greatly helps calcium absorption, with hard aged cheeses and fermented soy like natto as its best food sources.", "readers": 1, "refs": [4], "risk": "caution", "risk_note": "Nutrition claim from a single reader, presented as fact.", "verdict": "supported", "revised": false}, {"text": "One reader says calcium is important in reducing osteoporosis/osteopenia and muscle cramps.", "readers": 1, "refs": [3], "risk": "caution", "risk_note": "Health claim from one reader that could be read as established fact.", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether calcium supplements are worthwhile for bone health", "sides": [{"text": "Supplements add little or nothing for bones, and fracture rates are unaffected.", "readers": 2, "refs": [1, 2], "risk": "caution", "risk_note": "Efficacy claim resting on one source comment, repeated by another reader.", "verdict": "supported", "revised": false}, {"text": "One reader says calcium is important in reducing osteoporosis/osteopenia and muscle cramps.", "readers": 1, "refs": [3], "risk": "caution", "risk_note": "Health claim from one reader that could be read as established fact.", "verdict": "partly_supported", "revised": true}, {"text": "Algae-based calcium may do little itself but works as an insurance policy because it contains boron and other bone minerals.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "Framed as personal view and experience.", "verdict": "supported", "revised": false}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "One reader asks how to increase calcium intake when a family doctor discourages dairy and a dermatologist discourages sunbathing.", "readers": 1, "refs": [8], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader finds it puzzling that doctors keep recommending calcium supplements, and suggests they may not know the evidence or may want to seem proactive.", "readers": 1, "refs": [9], "risk": "none", "risk_note": "Questions doctors' recommendations, but it is an opinion and gives no instruction.", "verdict": "supported", "revised": false}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "One reader suggests that someone with bone loss consider Algae Cal bone builder supplements, saying their own bone scan improved from osteoporosis to the osteopenia range after taking them.", "readers": 1, "refs": [10], "risk": "caution", "risk_note": "Recommends a commercial supplement for bone loss based on one person's experience.", "verdict": "supported", "revised": true}, {"text": "One reader says getting calcium from food such as broccoli and dairy is better than taking supplements.", "readers": 1, "refs": [5], "risk": "caution", "risk_note": "Advice against supplements from one reader; it is tied to a cardiologist's instruction.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Latest  studies state this", "source": "nyt_units", "comment_id": "154070485", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itrel?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "Calcium supplements increase bone mass by 3% at the most, and have no impact at all on the incidence of bone breaks.", "source": "nyt_units", "comment_id": "154047765", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it58l?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "Ca++ in turn is important in reducing osteoporosis/osteopenia as well as muscle cramps.", "source": "wapo_units", "comment_id": "02eab289-5754-4bd0-a329-b807dba46dcf", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "Vitamin K is very helpful in aiding calcium absorption and the best source of that is hard cheeses like aged Gouda or Jarlsberg, or fermented soy like natto.", "source": "nyt_units", "comment_id": "154068258", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itp92?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "Best to get calcium through food, such as broccoli (who knew?) and dairy products.", "source": "wapo_units", "comment_id": "72346e22-632e-415e-b5dd-271e2dec4b52", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "I doubt the calcium does anything but it also has boron and other essential minerals for bones. More of an insurance policy.", "source": "nyt_units", "comment_id": "154079226", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu3vq?rsrc=cshare"}, {"n": 7, "who": "Reader 5", "quote": "I was told by my cardiologist to stop taking calcium supplements.", "source": "wapo_units", "comment_id": "72346e22-632e-415e-b5dd-271e2dec4b52", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 8, "who": "Reader 3", "quote": "Suggestions?", "source": "wapo_units", "comment_id": "02eab289-5754-4bd0-a329-b807dba46dcf", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 9, "who": "Reader 2", "quote": "Why doctors continue to recommend them is a mystery. They either don’t know, or want to feel like they’re doing something about your problem.", "source": "nyt_units", "comment_id": "154047765", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it58l?rsrc=cshare"}, {"n": 10, "who": "Reader 7", "quote": "You might want to take the bone builder supplements from Algae Cal.", "source": "wapo_units", "comment_id": "d43c048e-5910-4dff-895e-4cb42d3a27d7", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}, {"id": "T25", "title": "Dementia causes debated; benzodiazepines barely mentioned", "health": true, "breadth": 7, "sources": ["Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["wapo_units"], "takeaway": {"text": "Comments largely drift from benzodiazepines to other suspected dementia factors, such as diet, diabetes, blood flow, antidepressants and Vascepa, with benzodiazepines getting only a passing mention.", "readers": 5, "refs": [1, 2, 3, 4, 5], "risk": "none", "risk_note": "Summary of discussion; no actionable advice.", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "One reader says Alzheimer's disease is not caused by poor diet or too little exercise, while another says the evidence is not settled on whether poor diet causes or worsens it.", "readers": 2, "refs": [2, 3], "risk": "caution", "risk_note": "Claims about whether diet/exercise affect Alzheimer's rest on individual readers' assertions and could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "One reader says people with type 2 diabetes have a 50 to 60% greater chance of developing Alzheimer's disease.", "readers": 1, "refs": [5], "risk": "caution", "risk_note": "A specific statistic from a single reader, unsourced, which could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "One reader says that, from their own reading, antidepressants are now being linked to dementia risk.", "readers": 1, "refs": [6], "risk": "caution", "risk_note": "Antidepressant-dementia link rests on one reader's loose recollection; could discourage treatment if read as fact.", "verdict": "supported", "revised": false}, {"text": "One reader says cases of dementia, especially early-onset, are surging.", "readers": 1, "refs": [7], "risk": "caution", "risk_note": "Epidemiological claim from one reader with no source.", "verdict": "supported", "revised": false}, {"text": "One layperson believes blood flow to the brain is becoming a major medical focus because it seems closely tied to inflammatory symptoms that may mediate dementia onset or ordinary aging changes.", "readers": 1, "refs": [1], "risk": "none", "risk_note": "Clearly framed as a layperson's impression.", "verdict": "supported", "revised": false}, {"text": "One reader believes dementia can no longer be easily diagnosed and lumped under Alzheimer's disease.", "readers": 1, "refs": [8], "risk": "none", "risk_note": "Opinion about diagnostic categories, framed as an impression.", "verdict": "supported", "revised": false}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "One reader suggests that databases could be used to determine whether Vascepa use leads to dementia.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "Suggestion about research methods; no advice. Note the reader asserted this rather than asking it, and did not describe Vascepa as icosapent ethyl.", "verdict": "partly_supported", "revised": true}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "the issue of blood flow to the brain is becoming a major center of medical attention as it now appears closely related to inflammatory symptoms", "source": "wapo_units", "comment_id": "11376a40-aab0-4351-8f92-fcfcc413928e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 2, "who": "Reader 2", "quote": "Neither is Alzheimer's.", "source": "wapo_units", "comment_id": "3c460471-dfa7-4030-a181-599e9822da34", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 3, "who": "Reader 3", "quote": "The verdict is *definitely* not in on whether poor diet causes or exacerbates Alzheimer’s", "source": "wapo_units", "comment_id": "355f1484-309c-49b4-af61-1abe4b21ba19", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "Databases can determine if vascepa use leads to dementia", "source": "wapo_units", "comment_id": "7b971d5f-6c67-4af0-8cd6-e970ab324ab9", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 5, "who": "Reader 5", "quote": "people with type 2 diabetes have 50 to 60% greater chance of developing Alzheimer’s", "source": "wapo_units", "comment_id": "c9125365-6e68-4160-9d31-85d6bea0d28b", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "Was interesting to read that anti-deps are now on the dementia-bound train to hell.", "source": "wapo_units", "comment_id": "d44f208d-3464-4ae2-b075-2872c00441bc", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 7, "who": "Reader 7", "quote": "The cases of dementia, especially early-onset are surging.", "source": "wapo_units", "comment_id": "9285a95b-b8df-457d-b3f2-4f071e1fdf87", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 8, "who": "Reader 1", "quote": "The era of believing that dementia can be easily diagnosed and lumped under the rubric of Alzheimer's appears to be at an end.", "source": "wapo_units", "comment_id": "11376a40-aab0-4351-8f92-fcfcc413928e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}, {"id": "T26", "title": "Do fruits and vegetables lose nutrients before reaching the plate?", "health": true, "breadth": 7, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits"], "source_keys": ["nyt_units"], "takeaway": {"text": "Readers mostly argue that produce loses nutrients through depleted soil, time after picking, and long supply chains, though one reader says produce is as nutritious as claimed.", "readers": 5, "refs": [1, 2, 3, 4, 5, 6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, "status": "ok", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that fruits and vegetables are less nutritious than claimed, citing poor or depleted soil, agricultural practices, storage, and shipping.", "readers": 3, "refs": [1, 2, 4], "risk": "caution", "risk_note": "Nutrient-loss claims (e.g. potato losing a third of its vitamin C) rest on a few readers and could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "One reader says produce starts losing nutrients as soon as it is picked, and that food from supermarkets at the end of a long supply chain may not retain its nutrients.", "readers": 1, "refs": [3, 5], "risk": "caution", "risk_note": "Nutrient-loss claim rests on a single reader's belief and could be read as established fact.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says fresh food retains its nutrients.", "readers": 1, "refs": [7], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says some foods are more nutritious when cooked, depending on the food and the nutrient.", "readers": 1, "refs": [8], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says frozen fruits and vegetables are often more nutritious than 'fresh' ones, because they aren't shipped long distances or left sitting on shelves for days.", "readers": 1, "refs": [9], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "One reader disputes the nutrient-loss claims, saying fruits and vegetables provide abundant nutrition consistent with what is claimed.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether fruits and vegetables deliver the nutrition they are claimed to", "sides": [{"text": "Produce falls short of its claimed nutrition because of depleted soil, farming practices, storage, and shipping.", "readers": 3, "refs": [1, 2, 4], "risk": "caution", "risk_note": "Claim that produce falls short nutritionally rests on a few readers and could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "Fruits and vegetables provide abundant nutrition, consistent with the claims.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "the fruits and vegetables we eat do not provide the nutrition that they are claimed to due to poor soil, storage, shipping, etc.", "source": "nyt_units", "comment_id": "154133340", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivoqs?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "most fruits and vegetables in the U.S. don't contain the same levels of nutrients they used to, given agricultural practices", "source": "nyt_units", "comment_id": "154061969", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itj4h?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "Vegetables and fruits start losing nutrients as soon as they are picked.", "source": "nyt_units", "comment_id": "154118854", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivam6?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "Our food today does not contain the nutrients from the soil as it should because it is so depleted.", "source": "nyt_units", "comment_id": "154047590", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it536?rsrc=cshare"}, {"n": 5, "who": "Reader 3", "quote": "I don't believe that the food I buy retains it's nutrients, since I don't live on a farm", "source": "nyt_units", "comment_id": "154075220", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu02k?rsrc=cshare"}, {"n": 6, "who": "Reader 5", "quote": "Fruits and vegetables most definitely provide abundant nutrition consistent with what \"they are claimed to\"", "source": "nyt_units", "comment_id": "154190994", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j1h4i?rsrc=cshare"}, {"n": 7, "who": "Reader 6", "quote": "If your food is fresh, it’s retaining nutrients.", "source": "nyt_units", "comment_id": "154078152", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu2u8?rsrc=cshare"}, {"n": 8, "who": "Reader 6", "quote": "Some foods are more nutritious when cooked. It depends on the food and the nutrient in question.", "source": "nyt_units", "comment_id": "154078152", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu2u8?rsrc=cshare"}, {"n": 9, "who": "Reader 7", "quote": "I think frozen vegetables and fruits are often more nutritious than 'fresh'", "source": "nyt_units", "comment_id": "154137700", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivt34?rsrc=cshare"}]}, {"id": "T27", "title": "Preliminary supplement study: alarming headline, weak evidence?", "health": true, "breadth": 7, "sources": ["Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["wapo_units"], "takeaway": {"text": "Readers criticised the story for reporting preliminary, small or uncontrolled research, with one saying this sows unnecessary anxiety and another that the headline on such a small study was irresponsible.", "readers": 4, "refs": [1, 2, 3, 4], "risk": "none", "risk_note": "Comments about media coverage; no health advice.", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "One reader says the study is small and an outlier compared with other studies.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "", "verdict": "supported", "revised": true}, {"text": "One reader points out that people with brain disorders may have cognitive decline that does not resolve within minutes, such as with untreated or drug-resistant conditions over time.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "Personal reasoning, not advice.", "verdict": "supported", "revised": false}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "One reader suggests researchers should first rule out known toxins that enter the brain before drawing conclusions about less obvious causes of cognitive decline.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "Speculative suggestion, not actionable advice.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Conjecture isn't fact and it isn't news.", "source": "wapo_units", "comment_id": "5e6439ab-1e21-43aa-bf6a-664077b20fa0", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 2, "who": "Reader 2", "quote": "Why publich preliminary, small scale, observational studies about any serious medical issue such as cognitive decline?", "source": "wapo_units", "comment_id": "704a440b-8959-4b82-a902-db4c914947da", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 3, "who": "Reader 3", "quote": "Such a small study and outlier compared to all other studies that it seems irresponsible for the Washington Post to put this on front page headlines.", "source": "wapo_units", "comment_id": "89169cb1-21b8-443d-8b7a-97bd7d4c1c7a", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "This article is full of vague generalizations, and these reports of uncontrolled studies are not helpful.", "source": "wapo_units", "comment_id": "3ef6ca4e-d536-4e84-98f4-6a840a0bb413", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 5, "who": "Reader 5", "quote": "People who have brain disorders MAY experience \"cognitive decline\" (not \"mental deterioration\") that is not aborted within 5-10 minutes", "source": "wapo_units", "comment_id": "581a8bed-4661-4841-b9eb-c60b5682716d", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "Before we jump to conclusions about what is not obvious, it seems critical to eliminate the toxins", "source": "wapo_units", "comment_id": "da1d514b-0d40-486a-b9e0-03208b259fb2", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}, {"id": "T28", "title": "Readers' own supplement routines, for and against", "health": true, "breadth": 6, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers shared personal supplement experiences, from proactive use and specific products to one reader who skips supplements on her doctor's advice; these are their own accounts.", "readers": 4, "refs": [1, 2, 3, 4], "risk": "none", "risk_note": "Framed as personal accounts. The takeaway's cite list includes c5 correctly but the item is fine; a minor wording issue about 'none of it is evidence' is editorial.", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader says she prefers taking supplements proactively and using the health care system as little as possible, and that this has worked well for her for 50 years.", "readers": 1, "refs": [1], "risk": "caution", "risk_note": "Reader's view favours supplements over the health care system and implies prescription drugs damage organs; framed as personal preference, but could discourage medical care.", "verdict": "supported", "revised": false}, {"text": "One reader says metformin reduces her B12 uptake, so she takes a multivitamin to get enough.", "readers": 1, "refs": [2], "risk": "none", "risk_note": "Personal experience; metformin lowering B12 is well-established.", "verdict": "supported", "revised": false}, {"text": "One reader says she has taken elderberry every morning for two years and has not been sick in that time, the first such stretch in over 30 years.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "Clearly framed personal experience, no advice.", "verdict": "supported", "revised": false}, {"text": "One reader says she takes creatine and it seems to work for her.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "Personal experience.", "verdict": "supported", "revised": false}, {"text": "One reader says her doctor told her to eat real unprocessed food such as the Mediterranean diet and skip over-the-counter supplements, and that her bloodwork is great at 65.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "Personal account of doctor's advice, no directive to others.", "verdict": "supported", "revised": false}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "One reader asks another commenter, lorraine, which supplements she takes.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "I prefer to use supplements proactively and use our heath care system as little as possible. This has worked well for me for the last 50 years.", "source": "nyt_units", "comment_id": "154048319", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it5pv?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "Metformin reduces my uptake of B12, so I take a multivitamin to get enough.", "source": "nyt_units", "comment_id": "154057996", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itf8c?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "these past two years are the first in over 30yrs that I have not gotten sick", "source": "nyt_units", "comment_id": "154083668", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu8ak?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "I take creatine, which has been shown to help with muscle development and cognitive ability. It does seem to work.", "source": "nyt_units", "comment_id": "154057488", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iteog?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "MY Dr said to just eat real unprocessed food like that in the Mediterranean diet and save your money", "source": "wapo_units", "comment_id": "caa6af19-57e2-4d63-be92-3230c4ffff79", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 6", "quote": "can you please tell us what you take?", "source": "nyt_units", "comment_id": "154102932", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iur4k?rsrc=cshare"}]}, {"id": "T29", "title": "Is nutrition research any good? Readers doubt it, with some exceptions", "health": true, "breadth": 7, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits"], "source_keys": ["nyt_units"], "takeaway": {"text": "Several readers criticise the quality of nutrition research, though one reader defends the long-running Harvard studies.", "readers": 4, "refs": [1, 2, 3, 4], "risk": "none", "risk_note": "The item makes no actionable health claim. Note that c7 says doctors know more than most, so the 'medical expertise' doubt isn't supported by that citation.", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "One reader says that well-done epidemiology, such as the Harvard group's decades-long health professionals studies, is invaluable for nutrition knowledge.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "One reader says Walter Willett is the most cited nutrition scientist in the world.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader argues that most of what is known in nutrition is the boring old advice to eat real food and not too much of it.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "One reader objects that the article quotes a cardiologist as a nutrition expert, which they see as a mismatch.", "readers": 1, "refs": [7], "risk": "none", "risk_note": "The item doesn't repeat the commenter's personal vitamin D anecdote.", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether nutrition research is reliable enough to trust", "sides": [{"text": "Nutrition research on humans is poor quality, and medical science is not good at nutrition. The field is among the most flawed in health, with confident voices who know little.", "readers": 3, "refs": [1, 2, 3], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Long-running Harvard cohort studies yield valuable nutrition knowledge.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "the nutritional literature on humans (not rodents) is of universally abysmally poor quality", "source": "nyt_units", "comment_id": "154052570", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it9uq?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "Medical science is not good at nutrition.", "source": "nyt_units", "comment_id": "154061485", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itild?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "The field of “Nutrition” is one of the most flawed, low data quality fields of health", "source": "nyt_units", "comment_id": "154079025", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu3ph?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "These are the people running the decades long health professionals studies.", "source": "nyt_units", "comment_id": "154056864", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ite50?rsrc=cshare"}, {"n": 5, "who": "Reader 4", "quote": "Walter Willett is the most cited nutrition scientist in the world.", "source": "nyt_units", "comment_id": "154056864", "article": "American th advice changes too often to be trusted, citing reversals on smoking, wine, coffee and supplements, and one questions why anyone bothers listening.", "readers": 3, "refs": [2, 3, 6], "risk": "caution", "risk_note": "Encourages ignoring health advice based on a few readers' views; smoking was never actually good for you.", "verdict": "partly_supported", "revised": true}, {"text": "Taking health advice only from those who agree with your existing views is like listening to social media and creates an echo chamber.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "One reader hopes the medical community will not send contradictory messages about regular exercise for aging, as they say has happened with supplements.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "One reader says they don't know why people bother listening to health advice, since what's good one day is terrible the next.", "readers": 1, "refs": [2], "risk": "caution", "risk_note": "Suggests ignoring health advice, resting on one reader and could discourage following medical guidance.", "verdict": "partly_supported", "revised": true}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Everyone is looking  for advice to make their own lives more fulfilling", "source": "nyt_units", "comment_id": "154048693", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it65l?rsrc=cshare"}, {"n": 2, "who": "Reader 2", "quote": "What's supposed to be great today is terrible for you tomorrow and vice versa. I don't know why we bother listening to any of this advice.", "source": "wapo_units", "comment_id": "c52fc2f5-7404-4fc3-b562-b6ebbfc4ae8c", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 3, "who": "Reader 3", "quote": "Smoking cigarettes is relaxing and therefore good for you. Next thing you knw they're bad.", "source": "wapo_units", "comment_id": "196270c5-edea-4bad-8396-e6a813ee4b3b", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "Taking advice only from people who agree with you is the same thing as listening to social media.  It's an echo chamber.", "source": "nyt_units", "comment_id": "154201563", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j1rer?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "NYT health articles are often useless and contain incomplete information -- primers are more insightful.", "source": "nyt_units", "comment_id": "154064843", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itlub?rsrc=cshare"}, {"n": 6, "who": "Reader 6", "quote": "I sure hope the medical community and researchers wouldn’t say similar things to regular exercises as far as aging is concerned!", "source": "wapo_units", "comment_id": "93544088-cc66-4181-b97a-9287bace5632", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
document.getElementById('title').textContent = D.title;
document.title = D.title;
document.getElementById('sub').textContent = D.subtitle;
document.getElementById('foot').textContent = D.footer;
const filters = [['all','All'],['reported_experiences','Experiences'],['claims','Claims'],['corrections','Corrections'],['disagreements','Disagreements'],['open_questions','Questions'],['advice','Advice']];
let active = 'all';
const chips = document.getElementById('chips');
filters.forEach(([k, label]) => { const b = $('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', k === active);
  b.onclick = () => { active = k; chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b)); render(); }; chips.appendChild(b); });
// Search: the whole query is matched as a phrase, case-insensitively, on word
// boundaries ("vitamin d" matches "Vitamin D" but not "vitamin deficiency").
function makeRe(q, flags) {
  if (!q) return null;
  let src = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
  if (/^\w/.test(q)) src = '\\b' + src;
  if (/\w$/.test(q)) src = src + '\\b';
  return new RegExp(src, flags || 'i');
}
let RE = null, REG = null;
const hit = t => !!(RE && t && RE.test(t));
function textWithMarks(el, text) {
  if (!REG) { el.appendChild(document.createTextNode(text)); return; }
  let i = 0, m; REG.lastIndex = 0;
  while ((m = REG.exec(text)) !== null) {
    if (!m[0].length) { REG.lastIndex++; continue; }
    el.appendChild(document.createTextNode(text.slice(i, m.index)));
    el.appendChild($('mark', null, m[0])); i = m.index + m[0].length;
  }
  el.appendChild(document.createTextNode(text.slice(i)));
}
function refsOf(card) { if (!card._byN) { card._byN = {}; card.refs.forEach(r => card._byN[r.n] = r); } return card._byN; }
// An item matches if its own text matches, or if a comment it cites does.
function itemHit(it, card) { return hit(it.text) || it.refs.some(n => hit(refsOf(card)[n].quote)); }
function line(el, it, card) {
  textWithMarks(el, it.text);
  el.appendChild(document.createTextNode(' '));
  el.appendChild($('span', 'n', '(' + it.readers + (it.readers === 1 ? ' reader)' : ' readers)')));
  it.refs.forEach(n => { const s = $('sup'); const a = $('a', null, '[' + n + ']'); a.href = '#' + card.id + '-r' + n;
    a.onclick = () => { card._det && (card._det.open = true); }; s.appendChild(a); el.appendChild(s); });
  if (it.risk === 'high') el.appendChild($('span', 'flag', 'check with a doctor'));
  else if (it.risk === 'caution') el.appendChild($('span', 'flag', 'unconfirmed'));
  if (RE && !hit(it.text)) {
    const via = it.refs.filter(n => hit(refsOf(card)[n].quote));
    if (via.length) el.appendChild($('span', 'via', 'match in source ' + via.map(n => '[' + n + ']').join('')));
  }
}
function render() {
  const q = document.getElementById('q').value.trim();
  RE = makeRe(q); REG = makeRe(q, 'gi');
  const root = document.getElementById('cards'); root.replaceChildren();
  let shownCards = 0, shownItems = 0;
  D.cards.forEach(card => {
    // Keep only the sections, items and disagreements that match the filter and the search.
    const secs = [];
    card.sections.forEach(s => {
      if (active !== 'all' && s.key !== active) return;
      const items = (s.items || []).filter(it => !RE || itemHit(it, card));
      const dis = (s.disagreements || []).filter(d => !RE || hit(d.issue) || d.sides.some(x => itemHit(x, card)));
      if (items.length || dis.length) secs.push({ label: s.label, items, dis });
    });
    const headHit = RE && active === 'all' && (hit(card.title) || (card.takeaway && itemHit(card.takeaway, card)));
    if (!secs.length && !headHit) return;
    shownCards++;
    const a = $('article'); a.id = card.id;
    const h = $('h2'); textWithMarks(h, card.title); a.appendChild(h);
    a.appendChild($('div', 'meta', card.breadth + ' readers took part · from comments on ' + card.sources.join(' and ')));
    const used = new Set();
    const use = it => it.refs.forEach(n => used.add(n));
    if (card.takeaway) { const p = $('p', 'take'); line(p, card.takeaway, card); a.appendChild(p); use(card.takeaway); }
    if (card.health) a.appendChild($('div', 'note', D.health_note));
    secs.forEach(s => {
      a.appendChild($('h3', null, s.label));
      const ul = $('ul');
      s.items.forEach(it => { const li = $('li'); line(li, it, card); ul.appendChild(li); use(it); shownItems++; });
      s.dis.forEach(d => { const li = $('li'); const b = $('span', 'issue'); textWithMarks(b, d.issue); li.appendChild(b);
        const sub = $('ul'); d.sides.forEach(x => { const sl = $('li'); line(sl, x, card); sub.appendChild(sl); use(x); shownItems++; });
        li.appendChild(sub); ul.appendChild(li); });
      a.appendChild(ul);
    });
    // Sources: only the comments cited by what is shown; opened automatically when one matches.
    const refs = card.refs.filter(r => !RE || used.has(r.n));
    const det = $('details'); card._det = det;
    det.appendChild($('summary', null, 'Sources (' + refs.length + ' comment' + (refs.length === 1 ? '' : 's') + ')'));
    const ol = $('ol', 'refs');
    refs.forEach(r => { const li = $('li'); li.id = card.id + '-r' + r.n; li.value = r.n;
      li.appendChild(document.createTextNode('“')); textWithMarks(li, r.quote);
      li.appendChild(document.createTextNode('” — ' + r.who + ', on '));
      if (r.url) { const l = $('a', null, r.article); l.href = r.url; l.target = '_blank'; l.rel = 'noopener'; li.appendChild(l); }
      else li.appendChild(document.createTextNode(r.article));
      ol.appendChild(li); });
    if (RE && refs.some(r => hit(r.quote))) det.open = true;
    det.appendChild(ol); a.appendChild(det);
    root.appendChild(a);
  });
  document.getElementById('count').textContent = RE
    ? shownItems + ' matching item' + (shownItems === 1 ? '' : 's') + ' in ' + shownCards + ' of ' + D.cards.length + ' topics'
    : shownCards + ' of ' + D.cards.length + ' topics';
}
// A search can be linked to: index.html?q=vitamin%20D&section=advice
const params = new URLSearchParams(location.search);
if (params.get('q')) document.getElementById('q').value = params.get('q');
if (filters.some(([k]) => k === params.get('section'))) {
  active = params.get('section');
  chips.querySelectorAll('.chip').forEach((c, i) => c.setAttribute('aria-pressed', filters[i][0] === active));
}
document.getElementById('q').addEventListener('input', render);
render();
</script></body></html>
