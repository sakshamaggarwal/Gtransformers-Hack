<script type="application/json" id="data">{"title": "What readers know: community knowledge from comments", "subtitle": "29 topics from reader comments on Americans Love Supplements, but Experts Doubt Their Benefits and Why scientists are starting to worry popular supplements could harm the aging brain. Every statement links to the comments behind it; reader counts are the number of different people cited.", "footer": "Summaries were generated by AI from reader comments, checked against the full comments, and reflect what readers wrote, not established fact.", "health_note": "These are reader experiences and claims collected from comments, not medical advice. Check with a doctor or pharmacist before changing what you take.", "cards": [{"id": "T1", "title": "Supplements: weak regulation, unclear evidence, and who to trust", "health": true, "breadth": 260, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers raise concerns that supplements are poorly regulated and often unproven, but disagree on whether the evidence shows no benefit, whether the article was useful, and what role doctors should play.", "readers": 5, "refs": [1, 2, 3, 4, 5], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "A commenter who is a member of the medical community says the profession has known for decades that supplements lack benefits and has told patients so.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader reports taking part in a multi-year study in which half the participants took vitamins and half did not, and the vitamin group showed no benefit.", "readers": 1, "refs": [7], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers report that their doctors prescribe supplements for deficiencies found through blood tests, or review supplements alongside prescriptions at every visit.", "readers": 2, "refs": [8, 9], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "A physician says patients often don't mention their supplements because they don't think supplements interact with prescribed medicine.", "readers": 1, "refs": [10], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says that after buying a supplement online, their data seemed to be shared and social media then pushed urgent marketing for other supplements. Another says supplements now cost almost twice what they did a few years ago.", "readers": 2, "refs": [11, 12], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader has known many people who take a supplement because it is easier than adding those nutrients through diet.", "readers": 1, "refs": [13], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that supplements are largely unregulated, and some attribute this to industry lobbying and campaign donations.", "readers": 3, "refs": [1, 14, 15], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers say studies not run by supplement companies, and most published studies, show no benefit from supplements, and some show harm.", "readers": 3, "refs": [2, 16, 17], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers say that many supplements are of no benefit, and that even beneficial ones can be harmful above a certain dose.", "readers": 5, "refs": [18, 19, 20, 21, 22], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers point out that there is no reliable way to know what a supplement contains, since contents may differ from the label or include contaminants.", "readers": 6, "refs": [23, 24, 25, 26, 27, 28], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers say ConsumerLab and USP test many supplements, though not all, and their websites show which products they have tested.", "readers": 2, "refs": [29, 30], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers say good studies of supplements are scarce because they are expensive and supplements can't be patented, so there is little profit motive. One reader says makers avoid FDA approval because their products would fail to show efficacy.", "readers": 7, "refs": [31, 32, 33, 34, 35, 36, 37], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers say that many doctors know little about nutrition and supplements, and receive little formal education on them.", "readers": 5, "refs": [38, 39, 40, 41, 42], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers note that the article says supplements can help with true deficiencies, and that deficiencies can be confirmed through lab tests before a physician recommends supplementation.", "readers": 6, "refs": [4, 43, 44, 45, 46, 47], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers say that supplement vendors profit while consumers do not, and that social media marketing pushes supplements on people who probably don't need them.", "readers": 6, "refs": [48, 49, 50, 51, 52, 53], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader with a public health nutrition background says most clinical evidence on supplements can only show an association with a health outcome, not a causal relationship.", "readers": 1, "refs": [54], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "Some readers say observational studies may not reflect individual differences in metabolism and can be easy to skew, and one notes that neither study gave information about dose.", "readers": 3, "refs": [55, 56, 57], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "Readers say the article leaves questions unanswered, such as who should take supplements, when, and how much is too much. They also say it treats supplements as one category and ignores people with imperfect diets.", "readers": 5, "refs": [58, 59, 60, 61, 62], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Some readers say the article is contradictory: it says supplements may help with deficiency but also that most have no benefit, and it tells readers to ask their doctor while saying doctors often recommend unneeded supplements.", "readers": 2, "refs": [63, 64, 65], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader notes the article didn't address another commenter's doctor-recommended case in particular, but points out that it does say there are good reasons to take supplements, such as to treat a nutrient deficiency.", "readers": 1, "refs": [66], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "One reader says the article cannot support a conclusion of harm because the studies are preliminary and observational.", "readers": 1, "refs": [67], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether supplements should be regulated, and how strictly", "sides": [{"text": "They should be regulated like medicines, with the FDA checking safety and effectiveness.", "readers": 3, "refs": [68, 69, 70], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "At a minimum, makers should be required to test products or have them independently tested for label accuracy and contamination.", "readers": 2, "refs": [71, 72], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"issue": "Whether the evidence shows supplements work", "sides": [{"text": "Studies show no benefit, and supplements are sold because they make money for sellers, not because they work.", "readers": 3, "refs": [2, 73, 16], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "Some readers say there are thousands of clinical trials, and many double-blind studies, showing that supplements work.", "readers": 2, "refs": [5, 74], "risk": "caution", "risk_note": "Broad efficacy claim resting on two readers, one an industry worker, that could be read as established fact.", "verdict": "partly_supported", "revised": true}, {"text": "The shortcomings lie in research quality or study design rather than the supplements themselves.", "readers": 2, "refs": [75, 76], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"issue": "Whether observational studies are a fair basis for conclusions about supplements", "sides": [{"text": "Observational studies are limited, skewed or even garbage, so they shouldn't be relied on.", "readers": 4, "refs": [55, 56, 77, 67], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Applying the observational-methodology caveat here is the same criticism used to dismiss supplement research, so it is inconsistent.", "readers": 1, "refs": [78], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"issue": "Whether the article's advice to ask a doctor is useful", "sides": [{"text": "It is contradictory or impractical, because doctors may not understand supplements or be reachable.", "readers": 4, "refs": [65, 79, 80, 81], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers should discuss supplements with their doctor; one says they trust their doctor's prescription over a headline.", "readers": 3, "refs": [82, 83, 84], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}]}, {"issue": "Whether paying for supplements is a waste of money", "sides": [{"text": "Some readers say supplements are probably a waste of money, especially for people who don't need them.", "readers": 2, "refs": [85, 86], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "They are cheap enough, or not without value, so they are not necessarily a waste.", "readers": 4, "refs": [87, 88, 89, 90], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "If someone has a vitamin deficiency, is it worth taking a supplement that may still be ineffective?", "readers": 1, "refs": [91], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Where and how did the researchers look for supplement benefits, and did the studies control for contents differing from labels?", "readers": 2, "refs": [92, 93], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Where are the references for the claim that thousands of clinical trials show supplements work?", "readers": 1, "refs": [94], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "Readers advise getting nutrients from a healthy, varied diet and lifestyle rather than from pills.", "readers": 5, "refs": [95, 96, 97, 98, 99], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers advise choosing supplements verified by third-party testers such as USP or ConsumerLab.", "readers": 4, "refs": [100, 101, 102, 103], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers advise telling your doctor about everything you take, including supplements, and discussing supplements with them before making changes.", "readers": 4, "refs": [104, 82, 105, 83], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "Readers advise getting checked or tested for deficiency, including periodically, and suggest a nutritionist or testing to monitor levels.", "readers": 2, "refs": [106, 107], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "One reader advises looking for double-blind, placebo-controlled studies from reputable sources when researching a supplement.", "readers": 1, "refs": [108], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "Readers advise following the science, or waiting for more follow-up studies, before changing supplement habits.", "readers": 2, "refs": [109, 110], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "supplements aren't regulated, thanks to heavy lobbying by the industry", "source": "wapo_units", "comment_id": "118204f2-2cd0-4575-bfa6-605d09ae1ccf", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 2, "who": "Reader 2", "quote": "studies not run by the supplement companies, show that people who take supplements are not healthier", "source": "nyt_units", "comment_id": "154060547", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itho3?rsrc=cshare"}, {"n": 3, "who": "Reader 3", "quote": "Many of us here disagree with these articles' takes and approaches.", "source": "nyt_units", "comment_id": "154066851", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itnt3?rsrc=cshare"}, {"n": 4, "who": "Reader 4", "quote": "It specifically said that supplements are useful for actual deficiencies.", "source": "nyt_units", "comment_id": "154135588", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivr14?rsrc=cshare"}, {"n": 5, "who": "Reader 5", "quote": "there are literally thousands of clinical trials showing dietary supplements work", "source": "nyt_units", "comment_id": "154048404", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it5sk?rsrc=cshare"}, {"n": 6, "who": "Reader 6", "quote": "We've known this for decades in the medical community and have said so to patients.", "source": "nyt_units", "comment_id": "154083615", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu88v?rsrc=cshare"}, {"n": 7, "who": "Reader 7", "quote": "half the participants took vitamin supplements and the other half did not over the course of several years. The results showed no benefit to the Vitamin group.", "source": "nyt_units", "comment_id": "154050817", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it881?rsrc=cshare"}, {"n": 8, "who": "Reader 8", "quote": "My doctor prescribes supplements for things that my small body is deficient in (based on blood test results).", "source": "nyt_units", "comment_id": "154067885", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itotd?rsrc=cshare"}, {"n": 9, "who": "Reader 9", "quote": "My doctors reviewed my supplements as well as my prescriptions at every visit.", "source": "nyt_units", "comment_id": "154043947", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it1hb?rsrc=cshare"}, {"n": 10, "who": "Reader 10", "quote": "patients often neglect to mention the supplements they take because they don’t believe their medicine.", "source": "nyt_units", "comment_id": "154044112", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it1mg?rsrc=cshare"}, {"n": 11, "who": "Reader 11", "quote": "Once you buy a supplement online, your data is shared and social media will bombard you with urgent need for other supplements.", "source": "wapo_units", "comment_id": "d0c8cc1d-843d-42a1-8a1c-a12cdba88100", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 12, "who": "Reader 12", "quote": "I have noticed that they seem to cost almost twice what they did a few years ago.", "source": "nyt_units", "comment_id": "154043709", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it19t?rsrc=cshare"}, {"n": 13, "who": "Reader 13", "quote": "I have known many people over my lifetime who pop a supplement because it’s easier then adding those nutrients into their diet.", "source": "wapo_units", "comment_id": "c7dfb249-2101-4d70-a660-d2a054edf5c6", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 14, "who": "Reader 14", "quote": "It’s unregulated.", "source": "wapo_units", "comment_id": "70cb7529-f972-469a-8205-d8b79f7981b3", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 15, "who": "Reader 15", "quote": "Easy answer to this one. Campaign \"donations.\"", "source": "nyt_units", "comment_id": "154177939", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j14cj?rsrc=cshare"}, {"n": 16, "who": "Reader 16", "quote": "Practically all of the studies find no benefit at all or sometimes they find they cause actual harm.", "source": "nyt_units", "comment_id": "154052570", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it9uq?rsrc=cshare"}, {"n": 17, "who": "Reader 17", "quote": "many many people are spending their money on substances that have no proven benefits", "source": "nyt_units", "comment_id": "154191146", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j1h9a?rsrc=cshare"}, {"n": 18, "who": "Reader 18", "quote": "Some have shown no benefit, and some can be harmful.", "source": "nyt_units", "comment_id": "154055360", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itcm0?rsrc=cshare"}, {"n": 19, "who": "Reader 19", "quote": "there is a healthy dose and a level beyond which the supplement is bad for you.", "source": "nyt_units", "comment_id": "154044373", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it1ul?rsrc=cshare"}, {"n": 20, "who": "Reader 20", "quote": "A lot of supplements probably have minimal or no benefit for maintaining a minimum acceptable level of health.", "source": "nyt_units", "c , "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 94, "who": "Reader 78", "quote": "Reference to \"thousands of clinical trials\" needed here.", "source": "nyt_units", "comment_id": "154051033", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it8ep?rsrc=cshare"}, {"n": 95, "who": "Reader 79", "quote": "Always better to get it from diet that a pill/ drink etc no matter whether you are talking about  vitamins or proteins etc.", "source": "nyt_units", "comment_id": "154083750", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iu8d6?rsrc=cshare"}, {"n": 96, "who": "Reader 11", "quote": "Eat healthy and a varieity is the best you can do.", "source": "wapo_units", "comment_id": "d0c8cc1d-843d-42a1-8a1c-a12cdba88100", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 97, "who": "Reader 80", "quote": "Healthy lifestyle>Supplementation.", "source": "nyt_units", "comment_id": "154098735", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4iun1f?rsrc=cshare"}, {"n": 98, "who": "Reader 81", "quote": "Maybe they should focus more on reasonable portions, nutritious food, enough protein and fiber, exercise, sleep, etc.", "source": "nyt_units", "comment_id": "154051530", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it8ua?rsrc=cshare"}, {"n": 99, "who": "Reader 82", "quote": "So: eat well, keep moving, and do not take supplements unless your doctor recommends them.", "source": "nyt_units", "comment_id": "154193193", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4j1j99?rsrc=cshare"}, {"n": 100, "who": "Reader 4", "quote": "Consumer Labs of America does testing, so at least you will know if what the label says is in the supplement is actually in it.", "source": "nyt_units", "comment_id": "154135737", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivr5p?rsrc=cshare"}, {"n": 101, "who": "Reader 83", "quote": "Only way you know what’s really in them is by buying ONLY supplements verified by a reputable third-party testers, such as USP.", "source": "wapo_units", "comment_id": "781b6555-3bde-456d-a674-533948df9f21", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 102, "who": "Reader 84", "quote": "Choose supplements that have been third party tested by consumer lab.", "source": "wapo_units", "comment_id": "169b9ad9-c8b2-42ba-9a26-1135537516f2", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 103, "who": "Reader 85", "quote": "make sure you take ones that are actually certified by a reputable organization", "source": "nyt_units", "comment_id": "154043873", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it1f1?rsrc=cshare"}, {"n": 104, "who": "Reader 86", "quote": "ALWAYS tell your medical team about EVERYTHING you are taking", "source": "wapo_units", "comment_id": "70f07e78-e4e9-4e1c-a6d4-81ad19ba0d8a", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 105, "who": "Reader 87", "quote": "talk to my doctor before making any changes", "source": "wapo_units", "comment_id": "f9b9c83f-14c3-4cb1-8f95-4d7d37888c94", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 106, "who": "Reader 88", "quote": "Get checked periodically.", "source": "wapo_units", "comment_id": "0e0279f4-0f74-4eff-aa80-1247c277d451", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 107, "who": "Reader 89", "quote": "Why not splurge and either get tested yourself OR get a referral to a nutritionist for biannual consults", "source": "wapo_units", "comment_id": "75391b5a-7b4f-492f-8ccb-61204a12ff2e", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 108, "who": "Reader 65", "quote": "Google is your friend.  Look for double-blind studies (i.e. a placebo is involved) from reputable sources.", "source": "nyt_units", "comment_id": "154056347", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4itdkr?rsrc=cshare"}, {"n": 109, "who": "Reader 90", "quote": "Follow science", "source": "nyt_units", "comment_id": "154050447", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4it7sf?rsrc=cshare"}, {"n": 110, "who": "Reader 91", "quote": "More studies need to follow up.", "source": "wapo_units", "comment_id": "9a975205-3843-463b-b791-c5e8df68a40b", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}, {"id": "T2", "title": "Vitamin D dosing: testing, deficiency, sunlight and what doctors prescribe", "health": true, "breadth": 118, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers mostly discuss their own vitamin D doses and test results, with broad support for supplementing when deficient and testing first, but disagreement over how much is appropriate and whether high doses help.", "readers": 4, "refs": [1, 2, 3, 4, 5], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "Readers report that their doctors prescribed or monitor vitamin D doses after low levels were found, with doses ranging from 1,000 IU to 2,000 IU daily and, in one case, 50,000 units for about a week.", "readers": 5, "refs": [6, 7, 8, 9, 10], "risk": "caution", "risk_note": "Gives specific doses, including a 50,000-unit course. These are personal experiences, but a reader could treat them as a guide.", "verdict": "partly_supported", "revised": false}, {"text": "One reader reports being put on massive vitamin D doses despite low-normal levels, then cutting back with their primary care doctor's help and losing faith in their bone density doctor.", "readers": 1, "refs": [5, 11], "risk": "caution", "risk_note": "One person links high-dose vitamin D to memory issues. This could be read as established fact.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says they took too much vitamin D thinking more was better and developed hypercalcemia, found through bloodwork. Another stopped a supplement after finding high blood levels, and another cut their dose from 4000 to 2000 IU to discuss with their doctor.", "readers": 3, "refs": [12, 13, 14], "risk": "none", "risk_note": "These are clearly framed personal experiences.", "verdict": "supported", "revised": false}, {"text": "Readers report taking vitamin D because blood tests showed they were low or deficient.", "readers": 2, "refs": [15, 16, 17], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "Readers report taking vitamin D for osteoporosis or bone health on their doctors' recommendation, and one says annual bloodwork shows their levels are neither deficient nor excessive.", "readers": 3, "refs": [18, 19, 20], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "Readers report taking vitamin D because they live where winter sun is scarce, or because skin cancer history or sun protection limits their sun exposure.", "readers": 4, "refs": [21, 22, 23, 24], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers report that vitamin D helps with seasonal affective disorder symptoms, for themselves or a spouse.", "readers": 2, "refs": [25, 26], "risk": "caution", "risk_note": "Anecdotal claims from two readers that vitamin D treats seasonal affective disorder. They could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "Some readers report having vitamin D levels checked regularly through yearly bloodwork.", "readers": 2, "refs": [19, 27], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says taking vitamin D with K2 improved calcium absorption and arrested their osteopenia.", "readers": 1, "refs": [28], "risk": "caution", "risk_note": "A single reader's claim that D3 with K2 arrested osteopenia. It could be read as a treatment claim.", "verdict": "supported", "revised": false}, {"text": "A 71-year-old reader says they have taken vitamin D daily for nearly two decades with no problems.", "readers": 1, "refs": [29], "risk": "none", "risk_note": "Clearly a personal experience. The reader wrote '1000mg', but the item gives no dose.", "verdict": "supported", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that vitamin D deficiency is widespread, and that low levels can lead to other health issues.", "readers": 5, "refs": [30, 31, 32, 33, 34], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers note that over-the-counter vitamin D products vary widely in strength, roughly 500 to 5,000 IU. One reader says recommended intakes have risen from 250 IU to as much as 4,000–5,000 IU.", "readers": 3, "refs": [4, 35, 36], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says daily doses of 20,000 IU or more can push blood levels to a range associated with higher morbidity.", "readers": 1, "refs": [37], "risk": "caution", "risk_note": "Rests on one reader's account of a single physician-scientist, and cites a specific dose threshold.", "verdict": "supported", "revised": false}, {"text": "Readers cite differing views of normal blood levels: one gives a reference range of 30–100 ng/ml, another says levels should stay under 100, and another says the Endocrine Society advises against routine testing and does not call levels above 20 ng/ml insufficient. One says peer-reviewed studies support levels above 50 ng/ml.", "readers": 5, "refs": [38, 39, 40, 41, 42], "risk": "caution", "risk_note": "Gives blood-level ranges and a claim about testing guidance that rest on individual readers. Some of this is AI-sourced.", "verdict": "supported", "revised": false}, {"text": "Readers point out that people at northern latitudes get too little winter sun to make enough vitamin D, so supplements may be recommended.", "readers": 4, "refs": [43, 44, 45, 46], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers say vitamin D comes from sun exposure, that diet alone is a poor source, and that older adults produce much less from sunlight.", "readers": 7, "refs": [47, 48, 49, 50, 51, 52, 53], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers point out that vitamin D is tied to calcium absorption, and that it is fat-soluble, so it is better absorbed with fat-containing food.", "readers": 5, "refs": [54, 55, 56, 57, 58], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says vitamin K2 is supposed to help direct vitamin D to the bones and notes it is not mentioned in the article. Another, quoting an AI overview, says K2 directs calcium into bones and teeth rather than letting it build up in arteries.", "readers": 2, "refs": [59, 60], "risk": "caution", "risk_note": "Supplement-mechanism claims from one reader and a pasted AI overview. They could be read as established fact.", "verdict": "partly_supported", "revised": true}, {"text": "Readers point out that vitamin D is not water soluble, so excess could be harmful, and that overdosing might be the problem if the association proves causal.", "readers": 3, "refs": [61, 62, 63], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader cites JAMA as saying randomized trials show high or mega-doses of vitamin D do not raise bone density or lower fracture risk. The same reader says doctors across the country are prescribing massive doses to women with osteoporosis whose levels are only slightly in the low range of normal.", "readers": 1, "refs": [3, 64], "risk": "caution", "risk_note": "A single reader's claim about trial evidence and prescribing practice, which could influence dosing decisions.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says VITAL shows no clinical benefit from supplements for most people with levels of 20–30 ng/ml.", "readers": 1, "refs": [65], "risk": "caution", "risk_note": "One reader's claim that supplements give no benefit at 20–30 ng/ml could lead people to stop supplements.", "verdict": "supported", "revised": false}]}, {"key": "corrections", "label": "Corrections and gaps readers raised", "items": [{"text": "One reader says vitamin D is sold in varying strengths (generally 1,000 to 5,000 IU) rather than coming from a single source, correcting another comment.", "readers": 1, "refs": [36], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says vitamin D can interfere with calcium absorption and raise blood calcium. Other readers say it is essential for absorbing calcium.", "readers": 3, "refs": [66, 55, 56], "risk": "caution", "risk_note": "The claim that vitamin D interferes with calcium absorption conflicts with standard understanding. The card does pair it with the rebuttals.", "verdict": "supported", "revised": false}, {"text": "Readers say the article overlooks the risks of low vitamin D, and that it did mention doctors recommending vitamin D despite mixed evidence.", "readers": 2, "refs": [67, 68], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "One reader says the article is wrong to call calcium and vitamin D supplements useless for elderly people.", "readers": 1, "refs": [69], "risk": "caution", "risk_note": "One reader's claim, backed by their own lab results, that calcium and vitamin D are necessary for the elderly.", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether vitamin D supplements benefit people who are deficient or have low-normal levels", "sides": [{"text": "Supplements are recommended and beneficial for people who are deficient, and the article's findings should not lead patients to stop doctor-advised vitamin D.", "readers": 4, "refs": [70, 71, 1, 72], "risk": "caution", "risk_note": "Advice about continuing supplements.", "verdict": "partly_supported", "revised": true}, {"text": "For most people with levels in the 20–30 ng/ml range, studies show no clinical benefit, and large doses for slightly low levels are questionable.", "readers": 2, "refs": [65, 5, 64, 3], "risk": "caution", "risk_note": "Claims of no benefit and doubts about large doses rest on two readers and could be read as established fact.", "verdict": "supported", "revised": false}]}, {"issue": "Whether sunlight can supply enough vitamin D in winter", "sides": [{"text": "Sunshine can supply plenty, and going outside even in snow helps.", "readers": 3, "refs": [47, 73, 48], "risk": "caution", "risk_note": "The claim that winter sun alone gives enough vitamin D is contested, and other readers cite latitude limits.", "verdict": "supported", "revised": false}, {"text": "Far-northern winter sun is insufficient, and people are often outdoors yet still need supplements.", "readers": 4, "refs": [44, 21, 46, 43], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "Readers ask whether the studies looked at effects by dose, what the average daily dose was, and why a particular dose was chosen.", "readers": 2, "refs": [74, 75], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "A reader asks whether participants took vitamin D to correct a deficiency or on top of a healthy intake.", "readers": 1, "refs": [76], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "A reader asks whether a patient should ignore an internist who recommended calcium and D3 after a bone density test showed some loss.", "readers": 1, "refs": [77], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "Readers advise getting vitamin D blood levels tested, including by paying out of pocket or ordering online, and having a GP monitor them.", "readers": 4, "refs": [78, 2, 79, 80], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Readers advise that people with a confirmed deficiency should keep taking supplements, and that those with good levels may not need them.", "readers": 3, "refs": [1, 81, 82], "risk": "caution", "risk_note": "Advice on continuing or stopping supplements. It is in line with usual guidance but still advice about supplement use.", "verdict": "supported", "revised": false}, {"text": "One reader advises taking vitamin K together with vitamin D and calcium.", "readers": 1, "refs": [83], "risk": "caution", "risk_note": "The reader actually wrote 'K3', which is not the usual supplement form. Vitamin K also interacts with anticoagulants. This is one reader's advice.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Continue taking it if you have a confirmed deficiency!", "source": "wapo_units", "comment_id": "df8db99f-0d97-4a97-b5a6-94e74f2dc4ae", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 2, "who": "Reader 2", "quote": "Maybe you can get a test to discover your vitamin D levels?", "source": "wapo_units", "comment_id": "36e40e1c-3c12-4763-b17b-668b869cb88b", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 3, "who": "Reader 3", "quote": "Randomized clinical trials indicate that taking high or megadoses of vitamin D does not increase bone mineral density or lower fracture risks. - JAMA", "source": "wapo_units", "comment_id": "b9550b4c-52b3-4379-b9b7-5cd9f68687d1", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 4, "who": "Reader 4", "quote": "The medical community went from recommending 250 IU of daily vitamin D to as much as 4,000-5,000 IU.", "source": "wapo_units", "comment_id": "f3ff2a1d-e633-4b74-89c2-ddbd2995e0ba", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 5, "who": "Reader 3", "quote": "I was put on massive doses of vitamin D even though my vitamin D levels were at the low end of normal.", "source": "wapo_units", "comment_id": "4186f386-f2a5-42d8-8b25-ed441a3e3d33", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 6, "who": "Reader 5", "quote": "She’s prescribed 1000 IUs for my slightly low D level.", "source": "wapo_units", "comment_id": "60a437be-134d-44c6-ab86-a6d1bb31bce8", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brai xpensive", "source": "wapo_units", "comment_id": "0917eaae-44c6-4fc0-8475-9a4eeeed54ca", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 81, "who": "Reader 11", "quote": "Of course you keep taking the vitamin!", "source": "wapo_units", "comment_id": "5a35dbc2-59ad-4ffa-a56d-a7290477d345", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}, {"n": 82, "who": "Reader 41", "quote": "They need a supplement.  They also need a diagnostic work-up.", "source": "nyt_units", "comment_id": "154135588", "article": "Americans Love Supplements, but Experts Doubt Their Benefits", "url": "https://www.nytimes.com/shared/comment/4ivr14?rsrc=cshare"}, {"n": 83, "who": "Reader 70", "quote": "Take K3 with D and calcium.", "source": "wapo_units", "comment_id": "4bf1b6cd-a8f4-4d94-b0d2-939c667e2be1", "article": "Why scientists are starting to worry popular supplements could harm the aging brain", "url": "https://www.washingtonpost.com/health/2026/09/10/scientists-are-investigating-whether-popular-supplements-could-harm-aging-brain/"}]}, {"id": "T3", "title": "Supplements (vitamin D, fish oil, glucosamine) and cognitive decline: preliminary, observational, and possibly reversed causation", "health": true, "breadth": 83, "sources": ["Americans Love Supplements, but Experts Doubt Their Benefits", "Why scientists are starting to worry popular supplements could harm the aging brain"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers stress that the findings are observational and do not prove causation, while some point to evidence that vitamin D deficiency itself is linked to worse cognition.", "readers": 2, "refs": [1, 2], "risk": "caution", "risk_note": "The claim that vitamin D deficiency is linked to worse cognition rests on two readers' comments.", "verdict": "partly_supported", "revised": true}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader says they have taken all three supplements discussed in the article for over 25 years, are 68 and still working, and are not worried about being cognitively impaired by them.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "Personal experience, clearly framed. The comment does not name the supplements.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says they have taken vitamin D for over 25 years on their physician's advice because levels decrease with age.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "Personal experience on a physician's advice.", "verdict": "supported", "revised": false}, {"text": "One reader says that after reading about vitamin D harms they noticed memory issues and cut back on vitamin D with their primary care doctor's help.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "Personal experience. The reader cut back with their doctor's help.", "verdict": "supported", "revised": false}, {"text": "One reader takes fish oil for brain health and says both parents had Alzheimer's disease.", "readers": 1, "refs": [6], "risk": "none", "risk_note": "Personal experience. It is about fish oil, not vitamin D.", "verdict": "supported", "revised": false}, {"text": "One reader, a 60-year-old with MS, says they had very low vitamin D levels and their doctor prescribed supplements, and that they trust their doctor over the headline.", "readers": 1, "refs": [7], "risk": "none", "risk_note": "Personal experience on a doctor's prescription.", "verdict": "partly_supported", "revised": true}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers say the findings are preliminary and far from conclusive, and that the evidence is not strong enough to base decisions on.", "readers": 4, "refs": [8, 9, 10, 11], "risk": "none", "risk_note": "No medical advice.", "verdict": "partly_supported", "revised": true}, {"text": "Readers note that the studies are observational, so they show correlation rather than causation, and that hidden co-factors or reverse causation could explain the links.", "readers": 3, "refs": [12, 13, 14], "risk": "none", "risk_note": "No medical advice.", "verdict": "partly_supported", "revised": true}, {"text": "Readers point out that the association with faster decline applied only to people with normal vitamin D levels, not those who were deficient or insufficient.", "readers": 2, "refs": [15, 16], "risk": "none", "risk_note": "Describes the study's finding. c15 adds advice to continue taking vitamin D if deficient, but the item does not repeat it.", "verdict": "supported", "revised": false}, {"text": "Readers say participants with adequate vitamin D showed less decline than those with low levels, and that deficiency is more strongly associated with dementia than supplementation is.", "readers": 2, "refs": [1, 2], "risk": "caution", "risk_note": "A health claim resting on two readers that could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "One reader cites an Emory study finding high-dose vitamin D may improve cognition in people at risk of dementia.", "readers": 1, "refs": [17], "risk": "caution", "risk_note": "A claim about high-dose vitamin D improving cognition, from one reader citing a study. It could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "One reader notes that an association in people with normal levels does not mean they should take more vitamin D, while many people with low levels do need supplementation.", "readers": 1, "refs": [18], "risk": "none", "risk_note": "Consistent with standard guidance to supplement when levels are low and to tell the medical team.", "verdict": "supported", "revised": false}, {"text": "Readers suggest reverse causation: people worried about brain health, or already at higher risk or in decline, may be more likely to take supplements such as fish oil and vitamin D.", "readers": 3, "refs": [19, 20, 21, 22], "risk": "none", "risk_note": "No medical advice. c33 and c41 are the same user's duplicate post, so there are three readers.", "verdict": "supported", "revised": false}, {"text": "One reader says supplement users often take several supplements at once, which confounds studies attributing effects to a single one.", "readers": 1, "refs": [23], "risk": "none", "risk_note": "No medical advice.", "verdict": "supported", "revised": false}, {"text": "One reader says vitamin D2 and D3 have been linked to different effects on amyloid plaques, with D2 tied to build-up and D3 to reduction.", "readers": 1, "refs": [24], "risk": "caution", "risk_note": "A claim about D2 and D3 and amyloid plaques from one reader, with no source. It could be read as established fact.", "verdict": "supported", "revised": false}, {"text": "One reader says the findings held across populations in spite of confounding variables; another calls the Emory study cited in a comment solid medical research that contradicts some of the article's main tenets.", "readers": 2, "refs": [25, 26], "risk": "none", "risk_note": "No medical advice. c27 refers to the Emory study in a linked comment, not the article's study.", "verdict": "partly_supported", "revised": true}, {"text": "One reader says the linked HRS 2022 Panel Data Quality Profile contains no food or diet information about the study.", "readers": 1, "refs": [27], "risk": "none", "risk_note": "No medical advice.", "verdict": "supported", "revised": false}, {"text": "One reader suggests that excess use of some supplements as the body ages may harm cognition.", "readers": 1, "refs": [28], "risk": "caution", "risk_note": "A claim that excess vitamin D and other supplements harm cognition with age, from one reader with no source. It could be read as established fact.", "verdict": "supported", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether the article's findings are a meaningful warning or overblown/alarmist", "sides": [{"text": "Readers say the findings are preliminary and not conclusive, but that the correlation is worth examining further.", "readers": 3, "refs": [12, 11, 29], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}, {"text": "The reporting is alarmist or lacks context, and the message about vitamin D is unsettled.", "readers": 3, "refs": [30, 31, 32], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}]}, {"issue": "Whether vitamin D is linked to worse or better cognitive outcomes", "sides": [{"text": "One reader says excess use of some supplements, including vitamin D, may harm cognition as the body ages, and another reports noticing memory issues after being put on high doses of vitamin D.", "readers": 2, "refs": [28, 5], "risk": "caution", "risk_note": "A claim of cognitive harm from vitamin D resting on a reader's assertion and an anecdote. It could be read as established fact.", "verdict": "partly_supported", "revised": true}, {"text": "Adequate vitamin D or supplementation in deficient people is linked to better cognition or no accelerated decline.", "readers": 4, "refs": [1, 16, 17, 2], "risk": "caution", "risk_note": "Health claims from a few readers about vitamin D and cognition.", "verdict": "supported", "revised": false}]}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "Is the problem the supplement itself, or omega-3 and vitamin D from any source?", "readers": 1, "refs": [33], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Could the gel used in supplement capsules be what interferes with the brain?", "readers": 1, "refs": [34], "risk": "none", "risk_note": "Speculation framed as a question.", "verdict": "supported", "revised": false}, {"text": "Are there supplements that can make a person stronger without harming cognitive function?", "readers": 1, "refs": [35], "risk": "none", "risk_note": "A quip phrased as a question.", "verdict": "supported", "revised": false}, {"text": "What are olive oil's effects on the aging brain?", "readers": 1, "refs": [36], "risk": "none", "risk_note": "The comment only asks someone to follow up on olive oil. It is not about vitamin D.", "verdict": "supported", "revised": false}, {"text": "Would a larger, more conclusive study show whether the results hold up under more rigorous data collection?", "readers": 1, "refs": [11], "risk": "none", "risk_note": "", "verdict": "partly_supported", "revised": true}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "Large database studies with over 100,000 subjects should be done before drawing supplement-cognition conclusions (from a physician who designs clinical trials).", "readers": 1, "refs": [37], "risk": "none", "risk_note": "", "verdict": "supported", "revised": false}, {"text": "Be cautious about discouraging others from using fish oil on the basis of the article's findings.", "readers": 1, "refs": [38], "risk": "none", "risk_note": "The comment is about fish oil and dry eye. It does not mention the article's findings explicitly.", "verdict": "supported", "revised": false}, {"text": "Use supplements for specific, targeted reasons and avoid broad 'brain health' products with over-broad promises.", "readers": 1, "refs": [39], "risk": "none", "risk_note": "Personal opinion on supplement use.", "verdict": "supported", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "study participants with \"adequate\" levels of Vitamin D displayed less cognitive decline than participants with lower or inadequate levels of Vitamin D", "source": "wap
