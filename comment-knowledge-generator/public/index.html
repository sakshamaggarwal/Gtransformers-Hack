<style>
:root{--bg:#faf9f6;--card:#fff;--ink:#1f1e1c;--muted:#6b6863;--line:#e4e1da;--accent:#3c5a99;--warn:#9a5b00;--warnbg:#fdf3e1}
@media (prefers-color-scheme:dark){:root{--bg:#191917;--card:#22221f;--ink:#ecebe6;--muted:#a3a19a;--line:#3a3935;--accent:#9db5ea;--warn:#f0b65c;--warnbg:#3a2f1c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:860px;margin:0 auto;padding:40px 20px 8px}h1{font-size:30px;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 18px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
input[type=search]{flex:1 1 100%;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
main{max-width:860px;margin:0 auto;padding:8px 20px 60px}.count{color:var(--muted);font-size:14px;margin:8px 0 14px}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin:0 0 18px}
article h2{font-size:21px;margin:0 0 4px;font-weight:600}.meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.take{font-size:17px;margin:0 0 12px}.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin:0 0 12px}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px;font-weight:600}
ul{margin:0;padding-left:20px}li{margin:4px 0}.n{color:var(--muted);font-size:13px;white-space:nowrap}
sup a{color:var(--accent);text-decoration:none;font-size:11px;margin-left:1px}.issue{font-weight:600}
.flag{color:var(--warn);font-size:12px;font-weight:600;margin-left:4px}
.via{color:var(--muted);font-size:12px;font-style:italic;margin-left:6px}
details{margin-top:14px;font-size:14px}summary{cursor:pointer;color:var(--accent)}
ol.refs{padding-left:24px;color:var(--muted)}ol.refs li:target{background:var(--warnbg)}ol.refs a{color:var(--accent)}
mark{background:#ffe58a;color:inherit;border-radius:2px}
footer{max-width:860px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}
</style></head><body>

<script type="application/json" id="data">{"title": "Demo: what readers know (synthetic test data)", "subtitle": "4 topics from reader comments on Demo: NYT-style article (synthetic) and Demo: Washington Post-style article (synthetic). Every statement links to the comments behind it; reader counts are the number of different people cited.", "footer": "Summaries were generated by AI from reader comments, checked against the full comments, and reflect what readers wrote, not established fact.", "health_note": "These are reader experiences and claims collected from comments, not medical advice. Check with a doctor or pharmacist before changing what you take.", "cards": [{"id": "T1", "title": "Vitamin D: test first, then dose carefully", "health": true, "breadth": 5, "sources": ["Demo: NYT-style article (synthetic)", "Demo: Washington Post-style article (synthetic)"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers favour testing vitamin D before supplementing, and one warns that high doses caused harm.", "readers": 3, "refs": [1, 2, 3], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}, "status": "review", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader's vitamin D was low when tested, and they now take 1,000 IU a day.", "readers": 1, "refs": [1], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}, {"text": "One reader says 10,000 IU of vitamin D a day led to hypercalcemia.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "Readers say real vitamin deficiency is uncommon with a varied diet.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}, {"key": "open_questions", "label": "Open questions", "items": [{"text": "How long should someone keep taking vitamin e bottle?", "health": true, "breadth": 2, "sources": ["Demo: NYT-style article (synthetic)"], "source_keys": ["nyt_units"], "takeaway": {"text": "Readers say supplements are unregulated and point to independent testers.", "readers": 2, "refs": [1, 2, 3], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}, "status": "ok", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "One reader says supplements aren't regulated, so you can't know what's inside.", "readers": 1, "refs": [1], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "Readers advise choosing supplements verified by an independent tester such as USP.", "readers": 2, "refs": [2, 3], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "Supplements aren't regulated, so you never know what's in the bottle.", "source": "nyt_units", "comment_id": "900002", "article": "Demo: NYT-style article (synthetic)", "url": "https://www.nytimes.com/shared/comment/fx900002?rsrc=cshare"}, {"n": 2, "who": "Reader 1", "quote": "Choose ones verified by a third-party tester like USP.", "source": "nyt_units", "comment_id": "900002", "article": "Demo: NYT-style article (synthetic)", "url": "https://www.nytimes.com/shared/comment/fx900002?rsrc=cshare"}, {"n": 3, "who": "Reader 2", "quote": "Consumer Lab tests a lot of brands too", "source": "nyt_units", "comment_id": "900021", "article": "Demo: NYT-style article (synthetic)", "url": "https://www.nytimes.com/shared/comment/fx900021?rsrc=cshare"}]}, {"id": "T3", "title": "Fish oil: eyes, krill and alternatives", "health": true, "breadth": 4, "sources": ["Demo: NYT-style article (synthetic)", "Demo: Washington Post-style article (synthetic)"], "source_keys": ["nyt_units", "wapo_units"], "takeaway": {"text": "Readers report personal benefit from fish oil but raise environmental and quality concerns.", "readers": 3, "refs": [1, 2, 3], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}, "status": "ok", "sections": [{"key": "reported_experiences", "label": "What readers report", "items": [{"text": "One reader says fish oil helped their dry eyes.", "readers": 1, "refs": [1], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}, {"key": "claims", "label": "What readers claim", "items": [{"text": "One reader says production depletes krill that whales depend on.", "readers": 1, "refs": [2], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}, {"text": "One reader says quality varies by brand.", "readers": 1, "refs": [3], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether omega-3 supplements help", "sides": [{"text": "They helped one reader's dry eyes.", "readers": 1, "refs": [1], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}, {"text": "They did nothing for one reader's triglycerides.", "readers": 1, "refs": [4], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}]}, {"key": "advice", "label": "Advice readers shared", "items": [{"text": "One reader suggests algae-based omega-3 as an alternative.", "readers": 1, "refs": [5], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "I take fish oil for dry eyes on my ophthalmologist's advice", "source": "wapo_units", "comment_id": "w-0004", "article": "Demo: Washington Post-style article (synthetic)", "url": "https://www.washingtonpost.com/"}, {"n": 2, "who": "Reader 2", "quote": "Fish oil production depletes the krill that whales depend on.", "source": "wapo_units", "comment_id": "w-0041", "article": "Demo: Washington Post-style article (synthetic)", "url": "https://www.washingtonpost.com/"}, {"n": 3, "who": "Reader 3", "quote": "Fish oil quality varies a lot from brand to brand.", "source": "wapo_units", "comment_id": "w-0042", "article": "Demo: Washington Post-style article (synthetic)", "url": "https://www.washingtonpost.com/"}, {"n": 4, "who": "Reader 4", "quote": "Omega-3 pills never did anything for my triglycerides", "source": "nyt_units", "comment_id": "900004", "article": "Demo: NYT-style article (synthetic)", "url": "https://www.nytimes.com/shared/comment/fx900004?rsrc=cshare"}, {"n": 5, "who": "Reader 1", "quote": "Algae-based omega-3 is an alternative", "source": "wapo_units", "comment_id": "w-0411", "article": "Demo: Washington Post-style article (synthetic)", "url": "https://www.washingtonpost.com/"}]}, {"id": "T4", "title": "Readers question the article's evidence", "health": false, "breadth": 3, "sources": ["Demo: Washington Post-style article (synthetic)"], "source_keys": ["wapo_units"], "takeaway": {"text": "Several readers say the findings are preliminary.", "readers": 3, "refs": [1, 2, 3], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}, "status": "review", "sections": [{"key": "claims", "label": "What readers claim", "items": [{"text": "Readers point out that the findings are preliminary and far from proof.", "readers": 3, "refs": [1, 2, 3], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}, {"key": "disagreements", "label": "Where readers disagree", "disagreements": [{"issue": "Whether to publish early findings", "sides": [{"text": "Don't publish preliminary work.", "readers": 1, "refs": [2], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}, {"text": "Wait for better studies.", "readers": 1, "refs": [2], "risk": "none", "risk_note": "", "verdict": "unverified", "revised": false}]}]}], "refs": [{"n": 1, "who": "Reader 1", "quote": "The findings are preliminary and far from proof.", "source": "wapo_units", "comment_id": "w-0 <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
document.getElementById('title').textContent = D.title;
document.title = D.title;
document.getElementById('sub').textContent = D.subtitle;
document.getElementById('foot').textContent = D.footer;
const filters = [['all','All'],['reported_experiences','Experiences'],['claims','Claims'],['corrections','Corrections'],['disagreements','Disagreements'],['open_questions','Questions'],['advice','Advice']];
let active = 'all';
const chips = document.getElementById('chips');
filters.forEach(([k, label]) => { const b = $('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', k === active);
  b.onclick = () => { active = k; chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b)); render(); }; chips.appendChild(b); });
// Search: the whole query is matched as a phrase, case-insensitively, on word
// boundaries ("vitamin d" matches "Vitamin D" but not "vitamin deficiency").
function makeRe(q, flags) {
  if (!q) return null;
  let src = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
  if (/^\w/.test(q)) src = '\\b' + src;
  if (/\w$/.test(q)) src = src + '\\b';
  return new RegExp(src, flags || 'i');
}
let RE = null, REG = null;
const hit = t => !!(RE && t && RE.test(t));
function textWithMarks(el, text) {
  if (!REG) { el.appendChild(document.createTextNode(text)); return; }
  let i = 0, m; REG.lastIndex = 0;
  while ((m = REG.exec(text)) !== null) {
    if (!m[0].length) { REG.lastIndex++; continue; }
    el.appendChild(document.createTextNode(text.slice(i, m.index)));
    el.appendChild($('mark', null, m[0])); i = m.index + m[0].length;
  }
  el.appendChild(document.createTextNode(text.slice(i)));
}
function refsOf(card) { if (!card._byN) { card._byN = {}; card.refs.forEach(r => card._byN[r.n] = r); } return card._byN; }
// An item matches if its own text matches, or if a comment it cites does.
function itemHit(it, card) { return hit(it.text) || it.refs.some(n => hit(refsOf(card)[n].quote)); }
function line(el, it, card) {
  textWithMarks(el, it.text);
  el.appendChild(document.createTextNode(' '));
  el.appendChild($('span', 'n', '(' + it.readers + (it.readers === 1 ? ' reader)' : ' readers)')));
  it.refs.forEach(n => { const s = $('sup'); const a = $('a', null, '[' + n + ']'); a.href = '#' + card.id + '-r' + n;
    a.onclick = () => { card._det && (card._det.open = true); }; s.appendChild(a); el.appendChild(s); });
  if (it.risk === 'high') el.appendChild($('span', 'flag', 'check with a doctor'));
  else if (it.risk === 'caution') el.appendChild($('span', 'flag', 'unconfirmed'));
  if (RE && !hit(it.text)) {
    const via = it.refs.filter(n => hit(refsOf(card)[n].quote));
    if (via.length) el.appendChild($('span', 'via', 'match in source ' + via.map(n => '[' + n + ']').join('')));
  }
}
function render() {
  const q = document.getElementById('q').value.trim();
  RE = makeRe(q); REG = makeRe(q, 'gi');
  const root = document.getElementById('cards'); root.replaceChildren();
  let shownCards = 0, shownItems = 0;
  D.cards.forEach(card => {
    // Keep only the sections, items and disagreements that match the filter and the search.
    const secs = [];
    card.sections.forEach(s => {
      if (active !== 'all' && s.key !== active) return;
      const items = (s.items || []).filter(it => !RE || itemHit(it, card));
      const dis = (s.disagreements || []).filter(d => !RE || hit(d.issue) || d.sides.some(x => itemHit(x, card)));
      if (items.length || dis.length) secs.push({ label: s.label, items, dis });
    });
    const headHit = RE && active === 'all' && (hit(card.title) || (card.takeaway && itemHit(card.takeaway, card)));
    if (!secs.length && !headHit) return;
    shownCards++;
    const a = $('article'); a.id = card.id;
    const h = $('h2'); textWithMarks(h, card.title); a.appendChild(h);
    a.appendChild($('div', 'meta', card.breadth + ' readers took part · from comments on ' + card.sources.join(' and ')));
    const used = new Set();
    const use = it => it.refs.forEach(n => used.add(n));
    if (card.takeaway) { const p = $('p', 'take'); line(p, card.takeaway, card); a.appendChild(p); use(card.takeaway); }
    if (card.health) a.appendChild($('div', 'note', D.health_note));
    secs.forEach(s => {
      a.appendChild($('h3', null, s.label));
      const ul = $('ul');
      s.items.forEach(it => { const li = $('li'); line(li, it, card); ul.appendChild(li); use(it); shownItems++; });
      s.dis.forEach(d => { const li = $('li'); const b = $('span', 'issue'); textWithMarks(b, d.issue); li.appendChild(b);
        const sub = $('ul'); d.sides.forEach(x => { const sl = $('li'); line(sl, x, card); sub.appendChild(sl); use(x); shownItems++; });
        li.appendChild(sub); ul.appendChild(li); });
      a.appendChild(ul);
    });
    // Sources: only the comments cited by what is shown; opened automatically when one matches.
    const refs = card.refs.filter(r => !RE || used.has(r.n));
    const det = $('details'); card._det = det;
    det.appendChild($('summary', null, 'Sources (' + refs.length + ' comment' + (refs.length === 1 ? '' : 's') + ')'));
    const ol = $('ol', 'refs');
    refs.forEach(r => { const li = $('li'); li.id = card.id + '-r' + r.n; li.value = r.n;
      li.appendChild(document.createTextNode('“')); textWithMarks(li, r.quote);
      li.appendChild(document.createTextNode('” — ' + r.who + ', on '));
      if (r.url) { const l = $('a', null, r.article); l.href = r.url; l.target = '_blank'; l.rel = 'noopener'; li.appendChild(l); }
      else li.appendChild(document.createTextNode(r.article));
      ol.appendChild(li); });
    if (RE && refs.some(r => hit(r.quote))) det.open = true;
    det.appendChild(ol); a.appendChild(det);
    root.appendChild(a);
  });
  document.getElementById('count').textContent = RE
    ? shownItems + ' matching item' + (shownItems === 1 ? '' : 's') + ' in ' + shownCards + ' of ' + D.cards.length + ' topics'
    : shownCards + ' of ' + D.cards.length + ' topics';
}
// A search can be linked to: index.html?q=vitamin%20D&section=advice
const params = new URLSearchParams(location.search);
if (params.get('q')) document.getElementById('q').value = params.get('q');
if (filters.some(([k]) => k === params.get('section'))) {
  active = params.get('section');
  chips.querySelectorAll('.chip').forEach((c, i) => c.setAttribute('aria-pressed', filters[i][0] === active));
}
document.getElementById('q').addEventListener('input', render);
render();
</script></body></html>
