name: tests

on:
  push:
  pull_request:
  workflow_dispatch:     # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run test cases (Chrome is preinstalled on ubuntu-latest)
        run: python scripts/run_tests.py
      - name: Show the report on the run's summary page
        if: always()
        run: cat reports/test_report_*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/
